<style>
/* ═════════ IronSplit 2 – lättläst, lugnt, stora mål ═════════ */
:root,[data-theme=light]{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface2:#F4F6F8;--line:#D5DCE3;--line2:#B9C4CF;
  --ink:#101922;--ink2:#34414D;--muted:#56636F;
  --accent:#0B6E57;--on:#FFFFFF;
  --up:#4338CA;--leg:#0E7490;--cardio:#A34A07;--food:#C2410C;--hard:#BE123C;--ok:#137A38;
  --okbg:#E3F5E9;--warnbg:#FFF4D6;--warnline:#E9C46A;--warnink:#6B3410;
  --series-1:#2a78d6;--series-2:#eb6834;--grid:#E3E8ED;
  --shadow:0 1px 2px rgba(16,25,34,.06);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0C1015;--surface:#151B22;--surface2:#1C232C;--line:#2A3440;--line2:#3A4654;
  --ink:#EEF2F6;--ink2:#C9D2DB;--muted:#9DA9B5;
  --accent:#3DD6AE;--on:#0C1015;
  --up:#A5B4FC;--leg:#67E8F9;--cardio:#FBBF24;--food:#FDBA74;--hard:#FDA4AF;--ok:#86EFAC;
  --okbg:#10291C;--warnbg:#2A2111;--warnline:#6B5320;--warnink:#FCDDA8;
  --series-1:#3987e5;--series-2:#d95926;--grid:#232C36;
  --shadow:none;
  color-scheme:dark;
}
html{font-size:17px;-webkit-text-size-adjust:100%}
html[data-size=stor]{font-size:19.5px}
html[data-size=xstor]{font-size:22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Störst text: lite tätare där utrymmet är trångt */
html[data-size=xstor] .tab{font-size:.7rem}
html[data-size=xstor] .wk div{font-size:.72rem}
html[data-size=xstor] .wk i{width:1.55rem;height:1.55rem}
html[data-size=xstor] .hd-sub{font-size:.8rem}
html[data-size=xstor] .hd-btn{font-size:.62rem}
/* Sidhuvud */
.hd{position:relative;z-index:40;background:var(--bg);border-bottom:1.5px solid var(--line);padding:calc(.6rem + env(safe-area-inset-top,0px)) 1.1rem .6rem}
.hd-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.hd-date{font-size:1.05rem;font-weight:700;line-height:1.25}
.hd-sub{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hd-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-width:3.4rem;padding:.35rem .5rem;border-radius:.9rem;border:1.5px solid var(--line2);background:var(--surface);font-size:.72rem;font-weight:700;color:var(--ink2)}
.hd-btn svg{width:1.4rem;height:1.4rem}
.hd-btn.hl{outline:3px solid var(--accent);outline-offset:2px}

/* Innehåll */
.main{padding:1.2rem 1.1rem calc(6.5rem + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:2rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700;margin:2rem 0 .7rem}
.lead{font-size:1.05rem;color:var(--ink2);margin-top:.35rem}
.small{font-size:.9rem;color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:1.1rem;padding:1.1rem;box-shadow:var(--shadow)}
.card+.card{margin-top:.8rem}
.card h3{font-size:1.1rem;font-weight:700;margin-bottom:.4rem}
.stack>*+*{margin-top:.8rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.row>*{flex:1 1 9rem}

/* Knappar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.3rem;padding:.5rem 1.1rem;border-radius:.95rem;border:2px solid transparent;font-weight:700;font-size:1.05rem;text-decoration:none;text-align:center;line-height:1.25}
.btn.pri{background:var(--c,var(--accent));color:var(--on)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.big{width:100%;min-height:3.9rem;font-size:1.15rem}
.btn.full{width:100%}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55}
.lnk{background:none;border:none;color:var(--ink2);text-decoration:underline;text-underline-offset:.2em;font-size:1rem;padding:.6rem .2rem;min-height:2.8rem}
.danger{color:var(--hard)!important;border-color:var(--hard)!important}

/* Nästa steg */
.next{margin-top:1.1rem;border-radius:1.3rem;padding:1.25rem 1.2rem;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 45%,var(--surface))}
.next-k{font-size:.95rem;font-weight:700;color:var(--ink2)}
.next-k .late{color:var(--hard)}
.next-t{font-size:1.75rem;font-weight:700;line-height:1.2;margin-top:.2rem}
.next-s{font-size:1.05rem;color:var(--ink2);margin:.35rem 0 1rem}

/* Dagens lista */
.ck-list{list-style:none;background:var(--surface);border:1.5px solid var(--line);border-radius:1.1rem;overflow:hidden}
.ck+.ck{border-top:1.5px solid var(--line)}
.ck button{display:grid;grid-template-columns:2.4rem 1fr 1rem;gap:.9rem;align-items:center;width:100%;text-align:left;padding:.9rem 1rem;background:none;border:none;min-height:4.2rem}
.ck-box{width:2.2rem;height:2.2rem;border-radius:50%;border:2.5px solid var(--line2);display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:transparent}
.ck.ok .ck-box{background:var(--ok);border-color:var(--ok);color:var(--on)}
.ck.now .ck-box{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.ck.now{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.ck-t{display:block;font-size:1.08rem;font-weight:700}
.ck.ok .ck-t{color:var(--ink2)}
.ck-s{display:block;font-size:.92rem;color:var(--muted);margin-top:.1rem}
.ck-time{display:block;font-size:.88rem;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.ck-chev{color:var(--muted);font-size:1.5rem;line-height:1}

/* Mätare */
.meter{margin-top:.2rem}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;font-size:1rem;color:var(--ink2);margin-top:.8rem}
.meter-row b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter-bar{height:.8rem;border-radius:.5rem;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:.35rem}
.meter-bar i{display:block;height:100%;border-radius:.5rem;background:var(--mc,var(--accent))}
.left{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.8rem}
.left div{background:var(--surface2);border:1.5px solid var(--line);border-radius:1rem;padding:.8rem .9rem}
.left b{display:block;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.left span{font-size:.92rem;color:var(--ink2)}

/* Veckan */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;margin-top:.2rem}
.wk div{text-align:center;padding:.5rem 0;border-radius:.8rem;font-size:.85rem;font-weight:700;color:var(--ink2)}
.wk div.today{background:var(--surface2);outline:2px solid var(--line2)}
.wk i{display:grid;place-items:center;width:1.9rem;height:1.9rem;margin:.3rem auto 0;border-radius:50%;border:2.5px solid var(--c,var(--line2));font-style:normal;font-size:.95rem;color:var(--on)}
.wk i.rest{border:none;color:var(--muted)}
.wk i.done{background:var(--ok);border-color:var(--ok)}

/* Notiser */
.note{margin-top:.8rem;padding:.8rem 1rem;border-radius:.9rem;background:var(--warnbg);border:1.5px solid var(--warnline);color:var(--warnink);font-size:1rem}
.note.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ink)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:.5rem;background:var(--surface2);border:1.5px solid var(--line2);color:var(--ink2);vertical-align:.1em;margin-left:.4rem}
.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.tag.now{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:transparent;color:var(--ink)}

/* Programvecka */
.pw-bar{display:grid;grid-template-columns:repeat(8,1fr);gap:.25rem;margin:.6rem 0 .4rem}
.pw-bar i{height:.55rem;border-radius:.3rem;background:var(--surface2);border:1px solid var(--line)}
.pw-bar i.past{background:color-mix(in srgb,var(--accent) 50%,var(--surface))}
.pw-bar i.cur{background:var(--accent);border-color:var(--accent)}

/* Träna */
.hero{border-radius:1.3rem;padding:1.3rem 1.2rem;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 45%,var(--surface));margin-top:1.1rem}
.hero-k{font-size:.95rem;font-weight:700;color:var(--ink2)}
.hero-t{font-size:1.9rem;font-weight:700;line-height:1.15;margin-top:.15rem}
.hero-s{font-size:1.05rem;color:var(--ink2);margin:.4rem 0 1.1rem}
.list{background:var(--surface);border:1.5px solid var(--line);border-radius:1.1rem;overflow:hidden}
.list>details+details,.list>.li+.li{border-top:1.5px solid var(--line)}
.list summary{list-style:none;display:grid;grid-template-columns:3.2rem 1fr auto;gap:.7rem;align-items:center;padding:.9rem 1rem;cursor:pointer;min-height:4rem}
.list summary::-webkit-details-marker{display:none}
.list summary::after{content:'';grid-column:3;grid-row:1;justify-self:end;width:.65rem;height:.65rem;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 .3rem .3rem}
.list details[open] summary::after{transform:rotate(-135deg);margin-top:.4rem}
.day-d{font-weight:700;color:var(--ink2);border-left:.3rem solid var(--c,var(--line2));padding-left:.55rem;line-height:1.8}
.day.today .day-d{color:var(--ink)}
.day-t{display:block;font-size:1.08rem;font-weight:700}
.day-s{display:block;font-size:.92rem;color:var(--muted)}
.day-in{padding:0 1rem 1.1rem}
.day-p{color:var(--ink2);margin-bottom:.5rem}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.7rem 0;border-top:1.5px solid var(--line)}
.ex-row small{display:block;font-size:.88rem;color:var(--muted)}
.ex-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
.school summary{grid-template-columns:1fr auto;font-weight:700;font-size:1.05rem}
.school summary::after{grid-column:2}
.school p{padding:0 1rem 1.1rem;color:var(--ink2)}

/* Mat */
.meal{background:var(--surface);border:1.5px solid var(--line);border-radius:1.1rem;padding:1rem 1.1rem}
.meal+.meal{margin-top:.8rem}
.meal.now{border:2px solid color-mix(in srgb,var(--food) 55%,var(--surface))}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.meal-n{font-size:1.2rem;font-weight:700}
.meal-tm{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.meal-need{margin-top:.3rem;font-size:1rem;color:var(--ink2)}
.meal-need b{color:var(--ink)}
.foods{list-style:none;margin-top:.6rem;border-top:1.5px dashed var(--line)}
.foods li{display:flex;justify-content:space-between;gap:.8rem;padding:.45rem 0;border-bottom:1.5px dashed var(--line);font-size:1rem}
.foods li b{white-space:nowrap}
.meal .row{margin-top:.9rem}
.entry{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1.5px solid var(--line)}
.entry:first-child{border-top:none}
.x{min-width:2.8rem;min-height:2.8rem;border-radius:.8rem;border:1.5px solid var(--line2);background:var(--surface);font-size:1.1rem;color:var(--ink2)}
textarea.inp{min-height:5rem;resize:vertical}
.inp{width:100%;padding:.8rem .9rem;border-radius:.9rem;border:2px solid var(--line2);background:var(--surface);font-size:1.05rem;outline:none}
.inp:focus{border-color:var(--accent)}
details.more>summary{list-style:none;cursor:pointer;font-weight:700;font-size:1.05rem;padding:.2rem 0;min-height:2.6rem;display:flex;align-items:center;justify-content:space-between}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'Visa';font-size:.9rem;font-weight:700;color:var(--ink2);text-decoration:underline}
details.more[open]>summary::after{content:'Dölj'}

/* Stegare (vikt, mål) */
.stepper{display:grid;grid-template-columns:4.2rem 1fr 4.2rem;gap:.6rem;align-items:stretch}
.stepper>button{min-height:4.2rem;border-radius:1rem;border:2px solid var(--line2);background:var(--surface2);font-size:2rem;font-weight:400;color:var(--ink)}
.st-val{position:relative}
.st-val input{width:100%;height:100%;min-height:4.2rem;border-radius:1rem;border:2px solid var(--c,var(--accent));background:var(--surface);text-align:center;font-size:2rem;font-weight:700;outline:none;font-variant-numeric:tabular-nums;padding:0 2.6rem 0 .6rem;-moz-appearance:textfield}
.st-val input::-webkit-outer-spin-button,.st-val input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.st-val em{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:1rem}
.st-lbl{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin:1.1rem 0 .5rem;font-weight:700;font-size:1.05rem}
.st-lbl small{font-weight:400;font-size:.85rem;color:var(--muted)}

/* Min kropp */
.big-num{font-size:2.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big-num small{font-size:1.1rem;color:var(--ink2);font-weight:700}
.chart{position:relative;margin-top:.6rem;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:.78rem;fill:var(--muted);font-family:inherit}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.92rem;color:var(--ink2);margin-top:.4rem}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend i{display:inline-block}
.lg-dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--series-2)}
.lg-line{width:1.3rem;height:2px;background:var(--series-1);border-radius:1px}
.tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1.5px solid var(--line2);border-radius:.8rem;padding:.5rem .7rem;font-size:.88rem;box-shadow:0 4px 14px rgba(0,0,0,.14);white-space:nowrap;display:none}
.tip b{display:block;font-size:.92rem}
.tip span{display:flex;align-items:center;gap:.4rem;color:var(--ink2)}
table.tbl{width:100%;border-collapse:collapse;margin-top:.5rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:.45rem .2rem;border-bottom:1.5px solid var(--line);font-size:.95rem}
.tbl th{color:var(--ink2);font-weight:700}
.rec{display:flex;justify-content:space-between;gap:.8rem;padding:.65rem 0;border-top:1.5px solid var(--line)}
.rec:first-child{border-top:none}
.rec b{white-space:nowrap}
.hist-l{font-size:.9rem;color:var(--muted);margin-top:.2rem}

/* Inställningar */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.5rem,1fr));gap:.5rem;margin-top:.5rem}
.seg button{min-height:3.3rem;border-radius:.9rem;border:2px solid var(--line2);background:var(--surface);font-weight:700;padding:.3rem}
.seg button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.set+.set{border-top:1.5px solid var(--line);margin-top:1rem;padding-top:1rem}
.set label,.set .set-t{display:block;font-weight:700;font-size:1.05rem}
.set p{font-size:.92rem;color:var(--muted);margin-top:.15rem}
.set .inp{margin-top:.5rem}
.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;background:none;border:none;text-align:left;padding:0}
.switch i{flex-shrink:0;width:3.4rem;height:2rem;border-radius:1rem;background:var(--line2);position:relative}
.switch i::after{content:'';position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{transform:translateX(1.4rem)}

/* Navigering */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1.5px solid var(--line);padding:.3rem .4rem calc(.3rem + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.tab{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.45rem .2rem;border:none;background:none;border-radius:.9rem;font-size:.82rem;font-weight:700;color:var(--muted);min-height:3.8rem}
.tab svg{width:1.6rem;height:1.6rem}
.tab.on{background:color-mix(in srgb,var(--accent) 13%,var(--surface));color:var(--ink)}
.tab.on svg{color:var(--accent)}
.tab.hl{outline:3px solid var(--accent);outline-offset:1px}

/* Toast */
.toast{position:fixed;left:50%;top:calc(.8rem + env(safe-area-inset-top,0px));transform:translate(-50%,-1rem);opacity:0;z-index:130;max-width:calc(100% - 2rem);padding:.8rem 1.2rem;border-radius:1rem;background:var(--ink);color:var(--bg);font-weight:700;font-size:1rem;pointer-events:none;transition:.25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Dialog / ark (även måltidsredigeraren) */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.5);display:none}
.sheet-bg.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;max-width:620px;margin:0 auto;padding:.8rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));border-radius:1.4rem 1.4rem 0 0;background:var(--surface);border:1.5px solid var(--line);border-bottom:none}
.sh-grip{width:3rem;height:.3rem;border-radius:.2rem;background:var(--line2);margin:0 auto 1rem}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}
.sh-t{font-size:1.5rem;font-weight:700;line-height:1.2}
.sh-x{min-height:2.8rem;padding:0 1rem;border-radius:.8rem;border:1.5px solid var(--line2);background:var(--surface);font-weight:700}
.sh-sub{font-size:.95rem;color:var(--ink2);margin-top:.2rem}
.gap{margin-top:.8rem;padding:.8rem 1rem;border-radius:.9rem;background:var(--warnbg);border:1.5px solid var(--warnline);color:var(--warnink);font-size:1rem}
.gap.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ink)}
.items{margin-top:1rem;border:1.5px solid var(--line);border-radius:1rem;overflow:hidden}
.item{display:grid;grid-template-columns:1fr 7.2rem 2.8rem;gap:.5rem;align-items:center;padding:.7rem .8rem}
.item+.item{border-top:1.5px solid var(--line)}
.item-n{font-weight:700}
.item-m{font-size:.85rem;color:var(--muted)}
.field{position:relative}
.field input{width:100%;padding:.75rem 2.8rem .75rem .75rem;border-radius:.8rem;border:2px solid var(--line2);background:var(--surface);font-size:1.05rem;outline:none;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--accent)}
.field em{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-style:normal;font-size:.8rem;color:var(--muted)}
.item-x{min-height:2.8rem;border-radius:.8rem;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink2)}
.empty{padding:1rem;text-align:center;color:var(--muted)}
.adders{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.9rem}
.adders button{min-height:4.2rem;border-radius:1rem;border:2px solid var(--line2);background:var(--surface2);font-size:.88rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.adders button span{font-size:1.3rem}
.adders button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.panel{margin-top:.8rem;padding:.8rem;border-radius:1rem;background:var(--surface2);border:1.5px solid var(--line)}
.res{margin-top:.6rem;display:grid;gap:.35rem;max-height:18rem;overflow-y:auto}
.res button{display:flex;justify-content:space-between;align-items:center;gap:.6rem;text-align:left;padding:.7rem .8rem;min-height:3rem;border-radius:.8rem;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
.res button small{font-size:.8rem;color:var(--muted);text-align:right}
.res .src{font-size:.85rem;font-weight:700;color:var(--ink2);padding:.4rem .2rem 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.5rem}
.mgrid .field input{padding-right:4rem}
.add-btn{min-height:3.2rem;border-radius:.8rem;border:none;background:var(--accent);color:var(--on);font-weight:700;padding:0 1rem}
.sh-btns{display:grid;gap:.6rem;margin-top:1.1rem}
.sh-btns button{min-height:3.5rem;border-radius:1rem;border:2px solid var(--line2);background:var(--surface);font-weight:700;font-size:1.05rem}
.sh-btns button.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}

/* Skanner */
.scan{position:fixed;inset:0;z-index:95;background:#000;display:none;flex-direction:column}
.scan.show{display:flex}
.scan video{flex:1;width:100%;object-fit:cover}
.scan-box{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:80%;max-width:360px;height:11rem;border:3px solid #fff;border-radius:1.2rem;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.scan-box i{position:absolute;left:6%;right:6%;height:2px;background:#fff;top:50%}
.scan-ui{position:absolute;left:1rem;right:1rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));display:grid;gap:.6rem}
.scan-msg{text-align:center;color:#fff;background:rgba(0,0,0,.6);padding:.8rem;border-radius:.9rem;font-size:1.05rem}
.scan-row{display:grid;grid-template-columns:1fr auto;gap:.5rem}
.scan-row input{padding:.9rem;border-radius:.9rem;border:2px solid #fff;background:#111;color:#fff;font-size:1.1rem}
.scan-row button,.scan-close{min-height:3.4rem;padding:0 1.2rem;border-radius:.9rem;border:none;background:#fff;color:#000;font-weight:700;font-size:1.05rem}
.scan-close{background:#333;color:#fff}

/* Guide */
.guide{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,14,20,.45)}
.guide.show{display:block}
.g-card{position:absolute;left:1rem;right:1rem;bottom:calc(5.4rem + env(safe-area-inset-bottom,0px));max-width:580px;margin:0 auto;padding:1.3rem 1.2rem 1.1rem;border-radius:1.3rem;background:var(--surface);border:2px solid var(--accent);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.g-card.top{bottom:auto;top:calc(5rem + env(safe-area-inset-top,0px))}
.g-ic{font-size:2rem}
.g-t{font-size:1.4rem;font-weight:700;margin-top:.3rem;line-height:1.25}
.g-d{font-size:1.05rem;color:var(--ink2);margin-top:.4rem}
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1.1rem}
.g-n{font-size:.95rem;font-weight:700;color:var(--muted)}
.g-btns{display:flex;gap:.5rem}
.g-skip{position:absolute;top:.6rem;right:.6rem}

/* ═════════ Tränarläget ═════════ */
.coach-ov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:var(--bg);color:var(--ink);--c:var(--accent)}
.coach-ov.show{display:flex}
.co-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.6rem;padding:calc(.6rem + env(safe-area-inset-top,0px)) 1rem .6rem;max-width:620px;width:100%;margin:0 auto}
.co-x,.co-snd{min-height:3rem;min-width:3rem;padding:0 .9rem;border-radius:.9rem;border:1.5px solid var(--line2);background:var(--surface);font-weight:700;font-size:1rem}
.co-snd{font-size:1.25rem;padding:0}
.co-where{text-align:center;font-weight:700;color:var(--ink2);font-size:1rem}
.co-bar{height:.55rem;border-radius:.3rem;background:var(--surface2);border:1px solid var(--line);overflow:hidden;max-width:588px;width:calc(100% - 2rem);align-self:center}
.co-bar i{display:block;height:100%;background:var(--c)}
.co-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.3rem 1.1rem 1rem;max-width:620px;width:100%;margin:0 auto}
.co-foot{padding:.6rem 1.1rem calc(.8rem + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto;display:grid;gap:.1rem;border-top:1.5px solid var(--line);background:var(--bg)}
.co-btn{width:100%;min-height:4rem;border-radius:1rem;border:none;background:var(--c);color:var(--on);font-size:1.2rem;font-weight:700}
.co-btn:active{transform:scale(.985)}
.co-links{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.co-link{background:none;border:none;color:var(--ink2);font-size:1rem;padding:.6rem .3rem;min-height:2.9rem;text-decoration:underline;text-underline-offset:.2em}
.co-kicker{font-size:1rem;font-weight:700;color:var(--ink2)}
.co-h{font-size:2rem;font-weight:700;line-height:1.15;margin-top:.2rem}
.co-p{font-size:1.1rem;color:var(--ink2);margin-top:.5rem}
.co-p b{color:var(--ink)}
.co-gym{display:inline-block;margin-top:.8rem;padding:.55rem .8rem;border-radius:.8rem;background:var(--surface);border:1.5px solid var(--line2);font-size:1rem;color:var(--ink2)}
.co-gym b{color:var(--ink)}
.co-card{margin-top:1rem;padding:1rem 1.1rem;border-radius:1.1rem;background:var(--surface);border:1.5px solid var(--line)}
.co-card h3{font-size:1.05rem;font-weight:700;margin-bottom:.5rem;color:var(--ink)}
.co-note{color:var(--warnink)!important;background:var(--warnbg);padding:.5rem .7rem;border-radius:.7rem;margin-top:.7rem}
.co-steps{list-style:none;display:grid;gap:.7rem;counter-reset:s}
.co-steps li{display:grid;grid-template-columns:2rem 1fr;gap:.7rem;font-size:1.05rem;counter-increment:s}
.co-steps li::before{content:counter(s);width:1.9rem;height:1.9rem;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-size:.95rem;font-weight:700}
.co-steps.small li{font-size:.98rem}
.co-tempo{margin-top:.8rem;font-size:1rem;color:var(--ink2)}
.co-dl{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1rem;font-size:1.05rem}
.co-dl dt{font-weight:700}
.co-dl dd{color:var(--ink2)}
.co-sug{margin-top:1rem;padding:.9rem 1rem;border-radius:1rem;background:var(--okbg);border:1.5px solid color-mix(in srgb,var(--ok) 40%,transparent);font-size:1.05rem}
.co-sug.amber{background:var(--warnbg);border-color:var(--warnline);color:var(--warnink)}
.co-video{display:flex;align-items:center;justify-content:center;margin-top:.9rem;min-height:3.4rem;border-radius:1rem;border:2px solid var(--line2);background:var(--surface);font-weight:700;color:var(--ink);text-decoration:none;font-size:1.05rem}
.co-more summary{font-weight:700;cursor:pointer;list-style:none;min-height:2rem;text-decoration:underline}
.co-more summary::-webkit-details-marker{display:none}
.co-more[open] summary{margin-bottom:.7rem}
.coach-ov .stepper>button{background:var(--surface)}
.coach-ov .st-val input{border-color:var(--c)}
.co-clock{font-size:4rem;font-weight:700;text-align:center;margin-top:1.2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.co-clock.big{font-size:5.2rem;margin-top:.4rem}
.co-center{text-align:center}
.co-tip{font-size:1.05rem;color:var(--ink2);margin-top:.8rem}
.co-tip b{color:var(--ink);font-variant-numeric:tabular-nums}
.ring{position:relative;width:min(15rem,66vw);aspect-ratio:1;margin:.8rem auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:14}
.ring-fg{fill:none;stroke:var(--c);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-size:3.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.co-restbar{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.7rem 1rem;border-radius:1rem;background:var(--warnbg);border:1.5px solid var(--warnline);color:var(--warnink);margin-bottom:1rem;font-size:1rem}
.co-restbar b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.rate{display:grid;gap:.7rem;margin-top:1.1rem}
.rate button{display:grid;grid-template-columns:3rem 1fr;gap:.8rem;align-items:center;text-align:left;padding:1rem;min-height:5.2rem;border-radius:1.1rem;border:2px solid var(--line2);background:var(--surface)}
.rate button:active{border-color:var(--c)}
.rate span{font-size:2.2rem;line-height:1}
.rate b{display:block;font-size:1.2rem}
.rate small{display:block;font-size:1rem;color:var(--ink2)}
.co-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(6rem,1fr));gap:.6rem;margin-top:1.1rem}
.co-tiles div{padding:.9rem .5rem;border-radius:1rem;background:var(--surface);border:1.5px solid var(--line);text-align:center}
.co-tiles b{display:block;font-size:1.9rem;line-height:1.1}
.co-tiles span{font-size:.92rem;color:var(--ink2)}
.co-switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;margin-top:1rem;padding:1rem 1.1rem;border-radius:1.1rem;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.co-switch b{display:block;font-size:1.05rem}
.co-switch small{display:block;font-size:.95rem;color:var(--ink2)}
.co-switch i{flex-shrink:0;width:3.4rem;height:2rem;border-radius:1rem;background:var(--line2);position:relative}
.co-switch i::after{content:'';position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:transform .2s}
.co-switch[aria-checked=true] i{background:var(--c)}
.co-switch[aria-checked=true] i::after{transform:translateX(1.4rem)}
.c-phase{font-size:3.4rem;font-weight:700;text-align:center;color:var(--c);margin-top:.8rem;line-height:1.05}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═════════ ONBOARDING ═════════ */
.onb{position:fixed;inset:0;z-index:70;display:none;background:var(--bg)}
.onb.show{display:block}
.ob-in{max-width:580px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(.8rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
.ob-top{display:flex;justify-content:space-between;align-items:center;min-height:2.8rem}
.ob-back{font-size:1.05rem}
.ob-n{font-weight:700;color:var(--muted)}
.ob-bar{height:.5rem;border-radius:1rem;background:var(--line);overflow:hidden;margin:.3rem 0 1rem}
.ob-bar i{display:block;height:100%;background:var(--accent);border-radius:1rem;transition:width .25s}
.ob-body{flex:1;overflow-y:auto;padding-bottom:1rem}
.ob-q{font-size:1.9rem;line-height:1.2;margin:.4rem 0 .2rem}
.ob-lbl{display:block;font-weight:700;font-size:1.1rem;margin:1.4rem 0 .5rem}
.ob-inp{font-size:1.25rem;min-height:3.6rem}
.ob-st{margin-top:1.4rem}
.ob-hint{text-align:center;margin-top:.5rem}
.ob-opts{display:grid;gap:.7rem;margin-top:1.2rem}
.ob-opt{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;text-align:left;min-height:4.2rem;padding:.9rem 1.1rem;border-radius:1rem;border:2px solid var(--line2);background:var(--surface);color:var(--ink)}
.ob-opt b{font-size:1.2rem}
.ob-opt span{color:var(--ink2);font-size:1rem}
.ob-opt[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ob-seg{margin-top:1.2rem}
.ob-res{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1.2rem 0 .6rem}
.ob-res div{background:var(--surface);border:2px solid var(--accent);border-radius:1rem;padding:1rem;text-align:center}
.ob-res b{display:block;font-size:2rem;line-height:1.1}
.ob-res span{color:var(--ink2)}
.ob-card{margin-top:1rem}
.ob-foot{padding-top:.6rem}

/* ═════════ v13: lugnare gränssnitt ═════════ */
h2{margin:1.8rem 0 .7rem}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;margin:1.8rem 0 .7rem}
.h2row h2{margin:0}
.ck-list.slim .ck button{grid-template-columns:2rem 1fr auto;gap:.8rem;min-height:3.7rem;padding:.65rem 1rem}
.ck-list.slim .ck-box{width:1.9rem;height:1.9rem;font-size:1rem}
.ck-r{font-size:.95rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ck.ok .ck-r{color:var(--ok)}
.ck.ok .ck-t{color:var(--muted);font-weight:400}
.ck-list.slim.wk-rows .ck button{grid-template-columns:2.8rem 1fr auto}
.wd-l{font-weight:700;color:var(--ink2);border-left:.3rem solid var(--c);padding-left:.5rem;line-height:1.7}
.wk-rows .ck.now .wd-l{color:var(--ink)}
.wk-rows .ck.ok .ck-r{font-size:1.2rem}
.ask{display:flex;align-items:center;gap:.7rem;width:100%;margin-top:1.4rem;padding:1rem 1.1rem;border-radius:1.1rem;border:1.5px dashed var(--line2);background:none;color:var(--ink2);font-weight:700;font-size:1rem;text-align:left}
.ask span{font-size:1.3rem}
.list.school details>div{padding:0 1rem 1.1rem}
.sum .left div{background:none;border:none;padding:0}
.sum .left b{font-size:2.2rem}
.legend{margin-top:.5rem}
.next-s{margin:.3rem 0 1rem}
.sum .row>*{flex-basis:6rem}
.h2row .small{white-space:nowrap}

/* ═════════════════════════════════════════════════════════════
   IRONSPLIT 4 · partiklar + rörlig typografi + isometrisk data
   ═════════════════════════════════════════════════════════════ */
:root,[data-theme=dark]{
  --bg:#07090D;--surface:#10141C;--surface2:#171C26;--line:#222A36;--line2:#323C4B;
  --ink:#F2F5F9;--ink2:#C3CBD7;--muted:#8E99AA;
  --accent:#C6F432;--on:#0A0D12;--glow:rgba(198,244,50,.35);
  --up:#9085E9;--leg:#2FD3A6;--full:#3987E5;--cardio:#F08A4B;--food:#F2A93B;--hard:#FF7A7A;--ok:#7EE08A;
  --okbg:#122818;--warnbg:#2A2111;--warnline:#6B5320;--warnink:#FCDDA8;
  --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--grid:#1D2430;
  --fx:#C6F432;--glass:rgba(16,20,28,.86);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#EEF0F3;--surface:#FFFFFF;--surface2:#F4F6F9;--line:#DDE2E9;--line2:#C3CBD6;
  --ink:#0C1118;--ink2:#313C4B;--muted:#586577;
  --accent:#3D6B00;--on:#FFFFFF;--glow:rgba(61,107,0,.18);
  --up:#6250D6;--leg:#0E7D62;--full:#2A78D6;--cardio:#B4501C;--food:#A86300;--hard:#C0262D;--ok:#1E7B34;
  --okbg:#E4F4E6;--warnbg:#FFF4D6;--warnline:#E9C46A;--warnink:#6B3410;
  --series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--grid:#E6EAF0;
  --fx:#2A78D6;--glass:rgba(255,255,255,.9);
  --shadow:0 6px 20px rgba(12,17,24,.08);
  color-scheme:light;
}
body[data-tab=week]{--fx:var(--up)}
body[data-tab=food]{--fx:var(--food)}
body[data-tab=prog]{--fx:var(--series-1)}
[data-theme=dark] body[data-tab=week]{--fx:#9085E9}[data-theme=dark] body[data-tab=food]{--fx:#F2A93B}[data-theme=dark] body[data-tab=prog]{--fx:#3987E5}
[data-theme=light] body[data-tab=week]{--fx:#6250D6}[data-theme=light] body[data-tab=food]{--fx:#A86300}[data-theme=light] body[data-tab=prog]{--fx:#2A78D6}
body{background:var(--bg)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.hd,.main,.nav{position:relative;z-index:1}
.nav{position:fixed}
.main{background:none}
h1,h2,h3,.kick,.big b,.now-t,.hero-t,.pc-name,.stat b,.sh-t,.ob-q,.co-h,.brand-t{font-family:'Archivo','Atkinson Hyperlegible',system-ui,sans-serif}

/* sidhuvud */
.hd{background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0}
.brand{display:flex;align-items:center;gap:.55rem}
.brand-m{display:flex;align-items:flex-end;gap:2px;height:1.2rem}
.brand-m i{width:.32rem;border-radius:2px;background:var(--accent);transform:skewY(-30deg)}
.brand-m i:nth-child(1){height:.6rem;opacity:.55}.brand-m i:nth-child(2){height:1rem;opacity:.8}.brand-m i:nth-child(3){height:1.2rem}
.brand-t{font-weight:800;font-stretch:118%;font-variation-settings:'wdth' 118;letter-spacing:.14em;font-size:.95rem}
.hd-btn{background:var(--surface);border:1px solid var(--line2);color:var(--ink2);border-radius:.9rem}
.hd-btn span{display:block}

/* rubriker och rörlig typografi */
h1{font-size:2.5rem;line-height:1.02;font-weight:800;letter-spacing:-.02em;font-variation-settings:'wdth' 112}
html[data-size=stor] h1{font-size:2.3rem}html[data-size=xstor] h1{font-size:2.1rem}
h2{font-size:1.15rem;font-weight:800;letter-spacing:.01em;font-variation-settings:'wdth' 108}
.kt{display:block}
.kt-c{display:inline-block}
.kt.go .kt-c{animation:ktIn .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*32ms)}
@keyframes ktIn{0%{opacity:0;transform:translateY(.55em) skewX(-8deg);font-variation-settings:'wdth' 62}60%{opacity:1}100%{opacity:1;transform:none;font-variation-settings:'wdth' 112}}
.kick{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hello{margin:.4rem 0 1rem}
.hello .kick{margin-bottom:.35rem}
.center{text-align:center}
.muted{color:var(--ink2);margin-top:.3rem}
.small{color:var(--muted)}

/* kort */
.card,.ck-list,.list,.meal-c,.prog-card,.sumc{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{border-radius:1.2rem}

/* nu-kortet och passkortet */
.now-card,.hero{position:relative;border-radius:1.4rem;padding:1.3rem 1.2rem 1.2rem;margin-top:.4rem;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 60%),var(--glass);
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--c) 10%,transparent) inset;overflow:hidden}
.now-card::before,.hero::before{content:'';position:absolute;inset:auto -20% -60% auto;width:70%;aspect-ratio:1;background:repeating-linear-gradient(-30deg,color-mix(in srgb,var(--c) 14%,transparent) 0 1px,transparent 1px 10px);opacity:.6;pointer-events:none;border-radius:50%}
.now-card .kick,.hero .kick{color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.now-t,.hero-t{font-size:2.05rem;font-weight:800;line-height:1.08;margin-top:.3rem;font-variation-settings:'wdth' 108;letter-spacing:-.01em}
.now-s,.hero-s{color:var(--ink2);margin:.45rem 0 1.05rem;font-size:1.02rem}
.btn{border-radius:1rem;gap:.55rem}
.btn svg{width:1.25rem;height:1.25rem;flex-shrink:0}

let SESSIONS=[],CARDIO=[],PROG=PROGRAMS[1];
function sessionList(id){return (S.prog&&S.prog.mod&&S.prog.mod[id])||null}
function buildSession(t,p){
  const list=sessionList(t.id)||t.ex,groups=[];
  list.forEach(e=>{const L=EXI[e.n];if(!L)return;const ex={n:e.n,sv:L.sv,s:e.s,r:e.r,rest:e.rest,note:e.note},g=MGN[L.m],last=groups[groups.length-1];
    if(last&&last.t===g)last.ex.push(ex);else groups.push({t:g,ex:[ex]})});
  const[day,short]=DAYN[t.dow];
  return{id:t.id,dow:t.dow,day,short,kind:t.kind,c:t.kind==='leg'?C_LEG:t.kind==='full'?C_FULL:C_UP,title:t.title,name:t.title,muscles:t.muscles,idea:t.idea,groups,prog:p.id,custom:!!sessionList(t.id)};
}
function cardioObj(c){return{...CARD[c.k],id:c.id,dow:c.dow,day:DAYN[c.dow][0],short:DAYN[c.dow][1],c:C_CARDIO}}
function applyProgram(){
  PROG=PROGRAMS.find(p=>p.id===(S.prog&&S.prog.id))||PROGRAMS.find(p=>p.id==='ul4');
  SESSIONS=PROG.s.map(t=>buildSession(t,PROG));
  CARDIO=PROG.c.map(cardioObj);
}
function findSession(id){
  const s=SESSIONS.find(x=>x.id===id);if(s)return s;
  for(const p of PROGRAMS){const t=p.s.find(x=>x.id===id);if(t)return buildSession(t,p)}
  return null;
}
function findCardio(id){
  const c=CARDIO.find(x=>x.id===id);if(c)return c;
  for(const p of PROGRAMS){const t=p.c.find(x=>x.id===id);if(t)return cardioObj(t)}
  return cardioObj({id,dow:0,k:'z2'});
}
function templateOf(id){for(const p of PROGRAMS){const t=p.s.find(x=>x.id===id);if(t)return t}return null}

const BLOCK=8;
function phaseOf(w){
  if(w<=2)return{n:'Inkörning',t:'Hitta rätt vikter. Lämna 2–3 reps i reserv.'};
  if(w<BLOCK)return{n:'Progression',t:'Öka reps varje pass. Når du taket i alla set – öka vikten.'};
  return{n:'Deload',t:'Halva antalet set, samma vikt. Kroppen återhämtar sig och du blir starkare nästa block.'};
}

/* ═════════ KOSTPLAN ═════════ */
const F=(n,amt,unit,kcalU,pU,flex,cU,fU)=>({n,amt,unit,kcalU,pU,flex:!!flex,cU,fU});
const DEFAULT_PLAN=[
  {role:'frukost',time:'07:30',foods:[F('Havregryn',60,'g',3.7,.13,1,.59,.07),F('Mjölk 1,5 %',2,'dl',46,3.5,0,5,1.5),F('Kvarg naturell',100,'g',.6,.11,0,.04,.002),F('Blåbär',100,'g',.5,.007,0,.12,.003)]},
  {role:'lunch',time:'12:00',foods:[F('Kycklingfilé',120,'g',1.1,.23,0,0,.015),F('Jasminris (okokt)',75,'g',3.5,.07,1,.78,.006),F('Grönsaker',150,'g',.3,.02,0,.05,.003),F('Olivolja',1,'msk',90,0,0,0,10)]},
  {role:'mellanmal',time:'15:30',foods:[F('Grekisk yoghurt 2 %',150,'g',.73,.09,0,.04,.02),F('Banan',1,'st',105,1.3,0,27,.4)]},
  {role:'pre',time:'18:30',foods:[F('Nötfärs 5 %',100,'g',1.25,.21,0,0,.05),F('Pasta (okokt)',85,'g',3.55,.13,1,.7,.015),F('Tomatsås & grönsaker',150,'g',.4,.015,0,.06,.005)]},
  {role:'post',time:'21:45',foods:[F('Proteinpulver',25,'g',3.8,.78,0,.06,.06),F('Havregryn',50,'g',3.7,.13,1,.59,.07),F('Mjölk 1,5 %',2,'dl',46,3.5,0,5,1.5)]},
];
const STEP={g:5,st:1,dl:.5,msk:.5,tsk:.5,skiva:1};
function mealName(role,training){return{frukost:'Frukost',lunch:'Lunch',mellanmal:'Mellanmål',pre:training?'Före träning':'Middag',post:training?'Efter träning':'Kvällsmål'}[role]||role}
function scaledPlan(){
  const base=S.plan||DEFAULT_PLAN;
  let fixed=0,flex=0;
  base.forEach(m=>m.foods.forEach(f=>{const k=f.amt*f.kcalU;f.flex?flex+=k:fixed+=k}));
  const fac=flex>0?Math.min(2.5,Math.max(.4,(S.budget-fixed)/flex)):1;
  return base.map(m=>{
    const foods=m.foods.map(f=>{
      const st=STEP[f.unit]||1;
      const amt=f.flex?Math.max(st,Math.round(f.amt*fac/st)*st):f.amt;
      return withMac({n:f.n,amt,unit:f.unit,kU:f.kcalU,pU:f.pU,cU:f.cU,fU:f.fU});
    });
    return{role:m.role,time:shiftTime(m),foods,...sumItems(foods)};
  }).map((m,i)=>{
    const o=(S.dayPlan[today()]||{})[i];if(!o)return m;
    const foods=o.map(f=>withMac({...f}));
    return{...m,foods,o:true,...sumItems(foods)};
  });
}
function loggedOf(i){const L=(S.meals[today()]||{})[i];if(!L)return null;return{items:L,...sumItems(L)}}
/* makron: kolhydrater/fett slås upp om de saknas, annars uppskattas de från kalorierna */
function fillCF(x){
  if(x.cU!=null&&x.fU!=null)return x;
  const nm=x.n.toLowerCase(), hit=(typeof FOODS!=='undefined'?FOODS:[]).find(f=>f.unit===x.unit&&(nm.includes(f.n.toLowerCase().split(' (')[0])||f.n.toLowerCase().includes(nm)));
  if(hit)return{...x,cU:hit.cU,fU:hit.fU};
  const rest=Math.max(0,x.kU-4*x.pU);return{...x,cU:rest*.55/4,fU:rest*.45/9};
}
function withMac(x){x=fillCF(x);return{...x,kcal:Math.round(x.amt*x.kU),p:Math.round(x.amt*x.pU),c:Math.round(x.amt*x.cU),f:Math.round(x.amt*x.fU)}}
function sumItems(L){return L.map(withMac).reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{kcal:0,p:0,c:0,f:0})}
function dayTargets(){const f=Math.round(S.budget*.27/9);return{kcal:S.budget,p:S.protein,f,c:Math.max(0,Math.round((S.budget-S.protein*4-f*9)/4))}}
function dayEaten(exclude){return (S.food[today()]||[]).filter(x=>exclude===undefined||x.meal!==exclude).reduce((a,x)=>({kcal:a.kcal+(x.kcal||0),p:a.p+(x.p||0),c:a.c+(x.c||0),f:a.f+(x.f||0)}),{kcal:0,p:0,c:0,f:0})}
/* Vad en måltid behöver: det som fattas för dagen, fördelat på måltiderna som är kvar enligt planens proportioner */
function mealNeed(i){
  const plan=scaledPlan(), e=S.eaten[today()]||{}, T=dayTargets(), got=dayEaten(i);
  const open=plan.map((m,k)=>k).filter(k=>k===i||!e[k]);
  const out={};
  for(const key of ['kcal','p','c','f']){
    const sum=open.reduce((a,k)=>a+plan[k][key],0)||1;
    out[key]=Math.max(0,Math.round((T[key]-got[key])*plan[i][key]/sum));
  }
  return out;
}
function mealStatus(){
  const plan=scaledPlan(), e=S.eaten[today()]||{}, T=dayTargets();
  let run=dayEaten();plan.forEach((m,i)=>{if(e[i]){const L=loggedOf(i),v=L||m;run={kcal:run.kcal-v.kcal,p:run.p-v.p,c:run.c-v.c,f:run.f-v.f}}});
  return plan.map((m,i)=>{
    const L=loggedOf(i), eaten=!!e[i], actual=eaten?(L||{kcal:m.kcal,p:m.p,c:m.c,f:m.f}):null, need=eaten?null:mealNeed(i);
    const add=actual||m;run={kcal:run.kcal+add.kcal,p:run.p+add.p,c:run.c+add.c,f:run.f+add.f};
    return{i,eaten,actual,need,plan:m,after:{...run},T};
  });
}

const GOALS={lose:'gå ner i vikt och behålla musklerna',recomp:'bygga muskler och minska fett (recomp)',gain:'bygga muskler och gå upp i vikt'};
function hasHistory(s){return !!(Object.keys(s.log||{}).length||Object.keys(s.body||{}).length||Object.keys(s.food||{}).length||Object.keys(s.done||{}).length||s.uiV)}
function latestW(){const k=Object.keys(S.body).sort().reverse().find(d=>S.body[d].w);return k?+S.body[k].w:null}
function whoTxt(){
  const P=S.profile||{};const w=latestW()||P.w;
  return `${P.name?P.name+' (':'en person ('}${P.sex==='f'?'kvinna':'man'}${P.age?', '+P.age+' år':''}${P.h?', '+P.h+' cm':''}${w?', ca '+Math.round(w)+' kg':''}) som vill ${GOALS[P.goal||'recomp']}`;
}
/* Mifflin–St Jeor × aktivitet (inkl. 4 styrkepass + kondition) + mål */
function calcTargets(P){
  const bmr=10*P.w+6.25*P.h-5*P.age+(P.sex==='f'?-161:5);
  const tdee=bmr*({low:1.5,mid:1.62,high:1.78}[P.act]||1.5);
  const kcal=Math.max(P.sex==='f'?1300:1500,Math.min(4000,Math.round((tdee+({lose:-450,recomp:-100,gain:250}[P.goal]||0))/50)*50));
  const refW=Math.min(P.w,27*(P.h/100)**2);
  const protein=Math.max(60,Math.min(250,Math.round(refW*(P.goal==='gain'?1.8:2)/5)*5));
  return{kcal,protein};
}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>ds(new Date());
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return ds(x)}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function programWeek(){const diff=Math.floor((parseD(mondayOf(new Date()))-parseD(S.start))/864e5/7);const w=Math.max(0,diff)+1;return{abs:w,block:Math.ceil(w/BLOCK),w:((w-1)%BLOCK)+1}}
const isDeload=()=>programWeek().w===BLOCK;
const sessionFor=dow=>SESSIONS.find(s=>s.dow===dow);
const cardioFor=dow=>CARDIO.find(c=>c.dow===dow);
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function weekDates(){const m=parseD(mondayOf(new Date()));return WEEK.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return ds(d)})}

function dayRows(s,cd){

  return rows.sort((a,b)=>toMin(a.t)-toMin(b.t));

const allEx=s=>s.groups.flatMap(g=>g.ex);
const setsFor=ex=>isDeload()?Math.ceil(ex.s/2):ex.s;
function todaysSets(ex){
  const d=today();S.log[ex.n]=S.log[ex.n]||{};
  let t=S.log[ex.n][d];const n=setsFor(ex);
  if(!t){const prev=lastEntry(ex.n);t=S.log[ex.n][d]=Array.from({length:n},(_,i)=>({kg:prev&&prev[i]?prev[i].kg:(prev&&prev[0]?prev[0].kg:''),reps:'',ok:false}))}
  while(t.length<n)t.push({kg:t[0]?t[0].kg:'',reps:'',ok:false});
  return t;
}
const peekSets=ex=>(S.log[ex.n]||{})[today()]||null;
function lastEntry(name){const h=S.log[name]||{},d=today();const k=Object.keys(h).filter(x=>x<d&&h[x].some(y=>y.ok||y.reps)).sort();return k.length?h[k[k.length-1]]:null}
function exDone(ex){const t=peekSets(ex);return !!t&&t.slice(0,setsFor(ex)).every(x=>x.ok)}
function todaySetCount(){
  const s=sessionFor(new Date().getDay());if(!s)return{done:0,total:0};
  let done=0,total=0;allEx(s).forEach(ex=>{total+=setsFor(ex);const t=peekSets(ex);if(t)done+=t.slice(0,setsFor(ex)).filter(x=>x.ok).length});
  return{done,total};
}

${pantryText()}
Önskemål: ${wish||'inga'}
Svara ENDAST med JSON, ingen annan text, i exakt detta format:

  try{

    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    if(!res.ok)throw new Error(res.status===401?'Ogiltig API-nyckel.':'Claude svarade med fel '+res.status+'.');
    const data=await res.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
    const j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    if(!j.meals||!j.meals.length)throw new Error('Svaret saknade måltider.');
    S.plan=j.meals.map(m=>({role:m.role,time:m.time,foods:m.foods.filter(f=>f.amt>0).map(f=>F(f.n,+f.amt,f.unit,(+f.kcal||0)/f.amt,(+f.p||0)/f.amt,f.flex,f.c!=null?(+f.c)/f.amt:undefined,f.f!=null?(+f.f)/f.amt:undefined))}))
      .sort((a,b)=>toMin(a.time)-toMin(b.time));
    S.eaten[today()]={};S.food[today()]=(S.food[today()]||[]).filter(x=>x.meal===undefined);
    save();aiMsg='✓ '+(j.note||'Ny plan skapad.');
  }catch(e){
    aiMsg=(e.message&&!/fetch|network/i.test(e.message))?e.message:'Kunde inte nå Claude. Lägg in en API-nyckel under Inställningar.';
  }
  aiBusy=false;render();
}

/* ═════════ OPEN FOOD FACTS ═════════ */
function fromOFF(p,code){
  const n=p.nutriments||{};
  let k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;
  if(k==null)return null;
  const name=(p.product_name_sv||p.product_name||'').trim()||'Vara '+(code||'');
  const sq=parseFloat(p.serving_quantity);
  return{n:name,brand:(p.brands||'').split(',')[0].trim(),code:code||p.code||'',unit:'g',kU:k/100,pU:(+n.proteins_100g||0)/100,cU:(+n.carbohydrates_100g||0)/100,fU:(+n.fat_100g||0)/100,def:sq>0&&sq<1000?Math.round(sq):100};
}
async function lookupCode(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=code,product_name,product_name_sv,brands,nutriments,serving_quantity`);
  const j=await r.json();
  return j.status===1&&j.product?fromOFF(j.product,code):null;
}
async function searchOFF(q){
  const r=await fetch(`https://se.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=code,product_name,product_name_sv,brands,nutriments,serving_quantity`);
  const j=await r.json();
  return (j.products||[]).map(p=>fromOFF(p,p.code)).filter(Boolean);
}

let scanStream=null,scanCb=null,scanOn=false,detector=null;
async function startScan(cb){
  scanCb=cb;const el=document.getElementById('scan'),msg=document.getElementById('scan-msg');
  document.getElementById('scan-code').value='';el.classList.add('show');
  if(!('BarcodeDetector' in window)){msg.textContent='Kameraskanning stöds inte här. Skriv siffrorna under streckkoden.';return}
  try{
    detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.getElementById('scan-v');v.srcObject=scanStream;await v.play();
    msg.textContent='Håll streckkoden inom rutan';scanOn=true;scanLoop();
  }catch(e){msg.textContent='Kameran gick inte att starta. Tillåt kameran eller skriv streckkoden.'}
}
async function scanLoop(){
  if(!scanOn)return;
  try{const c=await detector.detect(document.getElementById('scan-v'));if(c.length){scanOn=false;navigator.vibrate&&navigator.vibrate(60);return gotCode(c[0].rawValue)}}catch(e){}
  setTimeout(scanLoop,200);
}
function manualCode(){const c=document.getElementById('scan-code').value.trim();if(c.length<6){toast('Skriv hela streckkoden');return}scanOn=false;gotCode(c)}
async function gotCode(code){
  document.getElementById('scan-msg').textContent='Hämtar innehållet…';
  let prod=null;try{prod=await lookupCode(code)}catch(e){}
  stopScan();
  if(prod){addToPantry(prod);scanCb&&scanCb(prod)}
  else{toast('Varan hittades inte – fyll i näringsvärdet själv');scanCb&&scanCb(null,code)}
}
function stopScan(){scanOn=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}document.getElementById('scan').classList.remove('show')}

/* ─── hjälpfunktioner ─── */
const kgTxt=v=>String(Math.round(v*10)/10).replace('.',',');
function durSv(sec){const m=Math.floor(sec/60),s=sec%60;return m?(s?`${m} min ${s} s`:`${m} min`):`${s} s`}
function range(ex){const[lo,hi]=ex.r.split('–').map(x=>parseInt(x));return{lo,hi}}
function kgStep(ex){if(/Dumbbell|Hammer|Wrist|Farmer|Suitcase|Goblet/.test(ex.n))return 2;if(/Kettlebell/.test(ex.n))return 4;if(/Leg Press|Hack Squat|Hip Thrust|Calf|Smith/.test(ex.n))return 5;return 2.5}
function startKg(ex){return{'Leg Press':60,'Hack Squat Machine':30,'Hip Thrust Machine':30,'Standing Calf Raise Machine':30,'Seated Calf Raise Machine':20,'Dumbbell Biceps Curl':8,'45° Back Extension':0,'Leg Extension':25,'Seated Leg Curl':25,'Lying Leg Curl':20,'Face Pull':15,'Cable Lateral Raise':5,'Machine Lateral Raise':15,'Pec Deck':25,'Dumbbell Bench Press':10,'Dumbbell Lateral Raise':4,'Dumbbell Shrug':14,'Hammer Curl':8,'Dumbbell Wrist Curl':6,'Reverse Wrist Curl':4,'Dumbbell Romanian Deadlift':12,'Hanging Knee Raise':0,'Cable Crossover':10,'Straight-Arm Pulldown':15,'Reverse Pec Deck':15,'Cable Shrug':25,'Preacher Curl Machine':15,'Triceps Dip Machine':30,'Smith Machine Squat':30,'Cable Glute Kickback':10,'Leg Press Calf Raise':60,'Seated Machine Row':30,"Farmer's Walk":16,'Suitcase Carry':16,'Dead Hang':0,'Kettlebell Swing':12,'Goblet Squat':12,'Dumbbell Step-Up':6}[ex.n]??20}
const unitOf=ex=>(EXI[ex.n]||{}).u||'';
const uw=ex=>({m:'meter',s:'sekunder'}[unitOf(ex)]||'repetitioner');
const ue=ex=>({m:'m',s:'s'}[unitOf(ex)]||'st');
const umore=ex=>({m:'gå några meter längre',s:'hänga några sekunder längre'}[unitOf(ex)]||'göra en repetition mer');
function kgLabel(ex){return ex.n==='45° Back Extension'||ex.n==='Hanging Knee Raise'||ex.n==='Dead Hang'?'Extra vikt (0 = bara kroppen)':/Dumbbell|Farmer|Hammer/.test(ex.n)?'Vikt per hantel':'Vikt'}
function lastRate(name){const h=(S.rate||{})[name]||{},d=today();const k=Object.keys(h).filter(x=>x<d).sort();return k.length?h[k[k.length-1]]:null}
function estMin(s){let sec=7*60;allEx(s).forEach((ex,i)=>{const n=setsFor(ex)+(i===0?1:0);sec+=n*45+n*ex.rest+60});return Math.round(sec/300)*5}

/* Personlig tränare: föreslå vikt och repetitioner utifrån förra gången */
function daysSinceLast(name){const h=S.log[name]||{},d=today();const k=Object.keys(h).filter(x=>x<d&&h[x].some(y=>y.ok||y.reps)).sort();if(!k.length)return 0;return Math.round((parseD(d)-parseD(k[k.length-1]))/864e5)}
function coPlan(ex){
  const{lo,hi}=range(ex),n=setsFor(ex),step=kgStep(ex),rate=lastRate(ex.n);
  const prev=(lastEntry(ex.n)||[]).filter(x=>x.kg!==''&&x.reps!=='');
  const mid=Math.round((lo+hi)/2);
  if(!prev.length)return{kg:startKg(ex),reps:Array(n).fill(mid),first:true,
    msg:`Första gången: börja hellre för lätt. Prova runt ${kgTxt(startKg(ex))} kg – du ändrar vikten på nästa skärm.`};
  const gap=daysSinceLast(ex.n);
  if(gap>=14&&!isDeload()){const ck=Math.max(0,Math.round(+prev[0].kg*.8/step)*step);
    return{kg:ck,reps:Array(n).fill(mid),comeback:true,msg:`Comeback: det är ${gap} dagar sedan du körde den här. Vi börjar på 80 % (${kgTxt(ck)} kg). Känns det lätt går du upp nästa set.`}}
  const kg=+prev[0].kg, allTop=prev.length>=Math.min(n,ex.s)&&prev.every(x=>+x.reps>=hi), anyLow=prev.some(x=>+x.reps<lo);
  const same=Array.from({length:n},(_,i)=>Math.min(hi,(+(prev[i]||prev[prev.length-1]).reps||lo)+1));
  if(isDeload())return{kg,reps:Array(n).fill(lo),msg:`Lätt vecka: färre set och samma vikt som förra gången (${kgTxt(kg)} kg). Kroppen återhämtar sig.`};
  if((allTop&&rate!=='hard')||(rate==='easy'&&!anyLow))
    return{kg:kg+step,reps:Array(n).fill(lo),up:true,msg:allTop?`Förra gången klarade du ${hi} ${uw(ex)} i alla set. Vi ökar till ${kgTxt(kg+step)} kg.`:`Förra gången kändes det lätt. Vi ökar till ${kgTxt(kg+step)} kg.`};
  if(rate==='hard'&&anyLow&&kg-step>=0)
    return{kg:kg-step,reps:Array(n).fill(lo),msg:`Förra gången var det för tungt. Vi sänker till ${kgTxt(kg-step)} kg så att du orkar hela setet med bra teknik.`};
  return{kg,reps:same,msg:`Samma vikt som förra gången (${kgTxt(kg)} kg). Försök ${umore(ex)} än sist.`};
}

  const running=C.wt&&C.wt>Date.now(),r=running?Math.ceil((C.wt-Date.now())/1000):sec;
  const body=st.k===0
    ?`<div class="co-h">Värm upp kroppen</div><p class="co-p">5 minuter i lugnt tempo på cykel, crosstrainer eller löpband. Du ska bli varm men kunna prata hela tiden.</p>`
    :`<div class="co-h">Rörlighet</div><p class="co-p">2 minuter. Gör rörelserna lugnt, det ska inte göra ont.</p><div class="co-card"><ol class="co-steps">${WARM_MOVES[warmK(s)].map(x=>`<li><span>${x}</span></li>`).join('')}</ol></div>`;
  return `<div class="co-body"><div class="co-kicker">Uppvärmning ${st.k+1} av 2</div>${body}
    <div class="co-clock" id="co-wt">${fmt(r)}</div>
    <p class="co-center">${running?'Jag säger till när tiden är slut.':'Tryck på knappen när du är på plats.'}</p></div>
    ${foot(running?`<button class="co-btn" onclick="coNext()">Klar – gå vidare</button>`:`<button class="co-btn" onclick="coWarmGo(${sec})">Starta ${sec/60} minuter</button>`,
      `<div class="co-links">${backLink()}<button class="co-link" onclick="coNext()">Hoppa över</button></div>`)}`;
}
function coWarmGo(sec){unlockAudio();S.coach.wt=Date.now()+sec*1000;save();coRender();say('Kör. Jag säger till när det är klart.')}

function coFind(st,s){
  const ex=allEx(s)[st.ei],I=INFO[ex.n]||{},p=coPlan(ex),n=setsFor(ex),group=(s.groups.find(g=>g.ex.includes(ex))||{}).t||'';
  const left=S.coach.order.length-1-st.pos;
  return `<div class="co-body">${restBanner()}
    <div class="co-kicker">Övning ${st.pos+1} av ${allEx(s).length} · ${group}</div>
    <div class="co-h">${ex.sv}</div>
    <div class="co-gym">På gymmet heter den <b>${ex.n}</b></div>
    ${I.mus?`<p class="co-p">Tränar: ${I.mus.toLowerCase()}.</p>`:''}
    <div class="co-card"><h3>Ställ in maskinen</h3><p class="co-p" style="margin:0">${I.set||'Ställ in sätet så att du sitter stadigt och bekvämt.'}</p>
      ${ex.note?`<p class="co-p co-note">${ex.note}</p>`:''}</div>
    <div class="co-sug"><b>Idag: ${n} set × ${ex.r} ${uw(ex)}${p.first?'':` med ${kgTxt(p.kg)} kg`}.</b><br>${p.msg}</div>
    ${videoBtn(ex)}
  </div>${foot(`<button class="co-btn" onclick="coNext()">Jag är redo</button>`,
    `<div class="co-links">${backLink()}${left>0?`<button class="co-link" onclick="coBusy()">Upptagen? Ta en annan först</button>`:''}</div>`)}`;
}
function videoBtn(ex){
  const I=INFO[ex.n]||{},url=I.v?YT(I.v):'https://www.youtube.com/results?search_query='+encodeURIComponent(ex.n.replace('/',' ')+' proper form');
  return `<a class="co-video" href="${url}" target="_blank" rel="noopener">▶ Se hur man gör (video)</a>`;
}
function coBusy(){
  const C=S.coach,st=coSteps(C)[C.i],o=C.order,ei=o.splice(st.pos,1)[0];o.push(ei);
  save();toast('Den här övningen flyttas sist');coRender();coSay();
}

function coSetScreen(st,s){
  const C=S.coach,ex=allEx(s)[st.ei],I=INFO[ex.n]||{},n=setsFor(ex),p=coPlan(ex),log=todaysSets(ex),{lo,hi}=range(ex);
  const d=C.draft[C.i]||{};
  let kg,reps;
  if(st.w){kg=d.kg??Math.max(0,Math.round(p.kg*.5/kgStep(ex))*kgStep(ex));reps=d.reps??12}
  else{
    const k=st.k,cur=log[k]||{};
    kg=d.kg??(cur.ok?cur.kg:(k>0&&log[k-1]&&log[k-1].ok?log[k-1].kg:p.kg));
    reps=d.reps??(cur.ok?cur.reps:p.reps[k]);
  }
  const last=!st.w&&st.k===n-1;
  const how=`<ol class="co-steps">${(I.how||[]).map(x=>`<li><span>${x}</span></li>`).join('')}</ol><p class="co-tempo">Lyft på 1 sekund, sänk långsamt på 2–3 sekunder. Andas ut när du lyfter.</p>`;
  const showHow=st.w||st.k===0;
  return `<div class="co-body">${restBanner()}
    <div class="co-kicker">${ex.sv}</div>
    <div class="co-h">${st.w?'Uppvärmningsset':`Set ${st.k+1} av ${n}`}</div>
    <p class="co-p">${st.w?(unitOf(ex)?'Ta ungefär halva vikten och gör en kort, lugn omgång. Det gör musklerna och lederna redo.':'Ta ungefär halva vikten och gör 12 lugna repetitioner. Det gör musklerna och lederna redo.'):`Sikta på <b>${reps}</b> ${uw(ex)}. Mellan ${lo} och ${hi} är okej.`}</p>
    <div class="st-lbl"><span>${kgLabel(ex)}</span><small>Tryck på siffran för att skriva</small></div>
    <div class="stepper"><button aria-label="Minska vikten" onclick="coStep('kg',-${kgStep(ex)})">−</button><div class="st-val"><input id="co-kg" type="number" inputmode="decimal" step="${kgStep(ex)}" min="0" value="${kg}" oninput="coDraft('kg',this.value)"><em>kg</em></div><button aria-label="Öka vikten" onclick="coStep('kg',${kgStep(ex)})">+</button></div>
    <div class="st-lbl"><span>${{m:'Meter du gick',s:'Sekunder du höll'}[unitOf(ex)]||'Repetitioner du gjorde'}</span></div>
    <div class="stepper"><button aria-label="Färre repetitioner" onclick="coStep('reps',-${unitOf(ex)==='m'?5:unitOf(ex)==='s'?5:1})">−</button><div class="st-val"><input id="co-reps" type="number" inputmode="numeric" min="0" value="${reps}" oninput="coDraft('reps',this.value)"><em>${ue(ex)}</em></div><button aria-label="Fler repetitioner" onclick="coStep('reps',${unitOf(ex)?5:1})">+</button></div>
    ${showHow?`<div class="co-card"><h3>Så gör du</h3>${how}</div>`:`<details class="co-card co-more"><summary>Visa hur du gör</summary>${how}</details>`}
  </div>${foot(`<button class="co-btn" onclick="coSetDone()">${last?'Klart – sista setet':`Klart – vila ${durSv(st.w?60:ex.rest)}`}</button>`,`<div class="co-links">${backLink()}${!st.w&&!last?'<button class="co-link" onclick="coSkipEx()">Hoppa över resten av övningen</button>':''}</div>`)}`;
}
function coSkipEx(){const C=S.coach,steps=coSteps(C),st=steps[C.i];let j=C.i+1;while(j<steps.length&&!(steps[j].t==='rate'&&steps[j].ei===st.ei))j++;C.rest=null;C.draft={};save();coGo(Math.min(j,steps.length-1));toast('Resten av övningen hoppas över')}
function coDraft(f,v){const C=S.coach;(C.draft[C.i]=C.draft[C.i]||{})[f]=v;save()}
function coStep(f,delta){
  const el=document.getElementById('co-'+f);let v=(parseFloat(el.value)||0)+delta;v=Math.max(0,Math.round(v*10)/10);
  el.value=v;coDraft(f,v);
}
function coSetDone(){
  const C=S.coach,s=coSess(C),st=coSteps(C)[C.i],ex=allEx(s)[st.ei],n=setsFor(ex);
  const kg=parseFloat(document.getElementById('co-kg').value),reps=parseInt(document.getElementById('co-reps').value);
  if(isNaN(kg)||isNaN(reps)){toast('Fyll i vikt och repetitioner');return}
  if(st.w){C.rest={end:Date.now()+60e3,dur:60,full:true};save();coNext();return}
  const t=todaysSets(ex);t[st.k]={kg,reps,ok:true};
  if(st.k+1<n&&t[st.k+1]&&!t[st.k+1].ok)t[st.k+1].kg=kg;
  const last=st.k===n-1;
  C.rest={end:Date.now()+ex.rest*1000,dur:ex.rest,full:!last};
  save();coNext();
}
function coRestScreen(s,steps){
  const C=S.coach,st=steps[C.i],r=Math.max(0,Math.ceil((C.rest.end-Date.now())/1000));
  const ex=allEx(s)[st.ei],p=coPlan(ex),log=todaysSets(ex),prev=log[st.k-1]||{};
  const circ=2*Math.PI*108;
  return `<div class="co-body co-rest">
    <div class="co-kicker">Vila</div>
    <div class="ring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="108" class="ring-bg"/><circle id="co-ring" cx="120" cy="120" r="108" class="ring-fg" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-r/C.rest.dur)}"/></svg>
      <div class="ring-t" id="co-rest">${fmt(r)}</div></div>
    <p class="co-center co-tip">${REST_TIPS[(C.i)%REST_TIPS.length]}</p>
    <div class="co-card"><h3>Sedan</h3><p class="co-p" style="margin:0"><b>Set ${st.k+1} av ${setsFor(ex)}</b> – ${ex.sv}, ${kgTxt(prev.ok?prev.kg:p.kg)} kg.</p></div>
  </div>${foot(`<button class="co-btn" onclick="coSkipRest()">Jag är redo nu</button>`,`<div class="co-links"><button class="co-link" onclick="coMoreRest()">+30 sekunder</button></div>`)}`;
}
function coSkipRest(){S.coach.rest=null;save();coRender();coSay()}
function coMoreRest(){const R=S.coach.rest;R.end+=30e3;R.dur+=30;save();coRender()}

function coRate(st,s){
  const ex=allEx(s)[st.ei];
  return `<div class="co-body">${restBanner()}
    <div class="co-kicker">${ex.sv} – klart ✓</div>
    <div class="co-h">Hur kändes det?</div>
    <p class="co-p">Tänk på det sista setet. Svaret styr vilken vikt jag föreslår nästa gång.</p>
    <div class="rate">
      <button onclick="coRated('easy')"><span>😌</span><div><b>Lätt</b><small>Jag hade orkat många fler repetitioner</small></div></button>
      <button onclick="coRated('ok')"><span>🙂</span><div><b>Lagom</b><small>Tungt på slutet, 1–2 repetitioner kvar</small></div></button>
      <button onclick="coRated('hard')"><span>😮‍💨</span><div><b>Mycket tungt</b><small>Jag orkade knappt, eller tekniken blev sämre</small></div></button>
    </div></div>${foot('',backLink())}`;
}
function coRated(v){
  const C=S.coach,ex=allEx(coSess(C))[coSteps(C)[C.i].ei];
  S.rate=S.rate||{};(S.rate[ex.n]=S.rate[ex.n]||{})[today()]=v;save();coNext();
}
function coCool(st,s){
  return `<div class="co-body">${restBanner()}
    <div class="co-kicker">Nästan klart</div><div class="co-h">Stretcha i 5 minuter</div>
    <p class="co-p">Håll varje stretch i ungefär 30 sekunder per sida. Andas lugnt. Det ska kännas, men inte göra ont.</p>
    <div class="co-card"><ol class="co-steps">${STRETCH[warmK(s)].map(x=>`<li><span>${x}</span></li>`).join('')}</ol></div>
  </div>${foot(`<button class="co-btn" onclick="coNext()">Klar med stretchen</button>`,`<div class="co-links">${backLink()}<button class="co-link" onclick="coNext()">Hoppa över</button></div>`)}`;
}
function sessionStats(s,d){
  let sets=0,vol=0;const prs=[];
  allEx(s).forEach(ex=>{
    const t=((S.log[ex.n]||{})[d]||[]).filter(x=>x.ok);sets+=t.length;
    t.forEach(x=>vol+=(+x.kg||0)*(+x.reps||0));
    const best=Math.max(0,...t.map(x=>+x.kg||0));
    const before=Math.max(0,...Object.entries(S.log[ex.n]||{}).filter(([k])=>k<d).flatMap(([,a])=>a.filter(x=>x.reps).map(x=>+x.kg||0)));
    if(best>0&&before>0&&best>before)prs.push(`${ex.sv}: ${kgTxt(best)} kg`);
  });
  return{sets,vol,prs};
}
function coDone(st,s){
  const C=S.coach,{sets,vol,prs}=sessionStats(s,today()),min=Math.max(1,Math.round((Date.now()-C.started)/6e4)),nx=nextSession();
  return `<div class="co-body">
    <div class="co-kicker">Passet är klart</div><div class="co-h">Bra jobbat! 💪</div>
    <div class="co-tiles"><div><b>${min}</b><span>${min===1?'minut':'minuter'}</span></div><div><b>${sets}</b><span>set</span></div><div><b>${vol>=1000?kgTxt(Math.round(vol/100)/10):vol}</b><span>${vol>=1000?'ton':'kg'} lyft</span></div></div>
    ${prs.length?`<div class="co-sug"><b>Nya rekord 🏆</b><br>${prs.join('<br>')}</div>`:''}
    <div class="co-card"><h3>Nu</h3><p class="co-p" style="margin:0">Ät din måltid efter träningen inom ett par timmar: protein och kolhydrater. Drick vatten.</p></div>
    <div class="co-card"><h3>Nästa pass</h3><p class="co-p" style="margin:0">${nx.title} på ${nx.day.toLowerCase()} kl ${TRAIN_TIME}.</p></div>
  </div>${foot(`<button class="co-btn" onclick="coSave()">Spara passet</button>`,backLink())}`;
}
function coSave(){
  const C=S.coach;
  if(C.kind==='cardio'){S.cardio[today()]={id:C.cid,min:Math.max(1,Math.round(cElapsed()/60))}}
  else S.done[today()]=C.sid;
  S.coach=null;save();tab='today';coClose();toast('Passet är sparat ✓');
}
function coEndEarly(){
  const C=activeCoach();if(!C)return;
  if(C.kind==='cardio'){coOpen();if(C.i===1)cEnd();else{C.i=2;save();coRender()}return}
  C.i=coSteps(C).length-1;C.rest=null;save();coOpen();
}

/* ─── röst, ljud och skärm ─── */
function toggleVoice(){S.voice=!S.voice;save();if(S.voice)say('Uppläsning på.');else try{speechSynthesis.cancel()}catch(e){};coRender()}
function say(t){
  if(!S.voice||!('speechSynthesis' in window)||!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
function coSay(){
  const C=S.coach;if(!C||!coIsOpen)return;
  if(C.kind==='cardio'){const p=cPhases(C)[C.p];if(C.i===1&&p)say(`${p.n}. ${p.say||p.sub}`);return}
  const s=coSess(C),st=coSteps(C)[C.i],ex=st.ei!=null?allEx(s)[st.ei]:null;
  if(C.rest&&C.rest.full&&C.rest.end>Date.now())return;
  if(st.t==='intro')say(`Dags för ${s.title}. ${allEx(s).length} övningar.`);
  else if(st.t==='warm')say(st.k===0?'Värm upp i fem minuter.':'Rörlighet i två minuter.');
  else if(st.t==='find')say(`Nästa övning: ${ex.sv}. ${(INFO[ex.n]||{}).set||''}`);
  else if(st.t==='set'){const d=C.draft[C.i]||{},p=coPlan(ex),kg=d.kg??p.kg;say(st.w?'Uppvärmningsset. Lätt vikt, tolv repetitioner.':`Set ${st.k+1} av ${setsFor(ex)}. ${kgTxt(kg)} kilo.`)}
  else if(st.t==='rate')say('Bra jobbat. Hur kändes det?');
  else if(st.t==='cool')say('Nu stretchar vi i fem minuter.');
  else if(st.t==='done')say('Bra jobbat! Passet är klart.');
}
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function ping(){
  try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}
  try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.frequency.value=880;
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.6);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.6)}catch(e){}
}
async function keepAwake(on){
  try{if(on&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    if(!on&&wl){await wl.release();wl=null}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&coIsOpen){keepAwake(true);coTick();coRender()}});

/* ─── klockan tickar ─── */
function coTick(){
  const C=S.coach;if(!C||!coIsOpen)return;
  if(C.kind==='cardio')return cTick();
  const now=Date.now();
  if(C.wt){
    const r=Math.max(0,Math.ceil((C.wt-now)/1000)),el=document.getElementById('co-wt');if(el)el.textContent=fmt(r);
    if(r<=0){C.wt=null;ping();say('Bra. Vi går vidare.');coNext();return}
  }
  if(C.rest){
    const r=Math.max(0,Math.ceil((C.rest.end-now)/1000));
    const t=document.getElementById(C.rest.full?'co-rest':'co-rb');if(t)t.textContent=fmt(r);
    const ring=document.getElementById('co-ring');if(ring){const circ=2*Math.PI*108;ring.style.strokeDashoffset=circ*(1-r/C.rest.dur)}
    if(r===10&&!C.rest.s10&&C.rest.full){C.rest.s10=1;say('Tio sekunder kvar.')}
    if(r<=0){
      const full=C.rest.full;C.rest=null;save();ping();
      if(full){coRender();const st=coSteps(C)[C.i];say(st.t==='set'&&!st.w?`Dags för set ${st.k+1}.`:'Dags igen.')}
      else{const b=document.querySelector('.co-restbar');if(b)b.remove();say('Vilan är klar.')}
    }
  }
}

/* ═════════ KONDITION MED GUIDE ═════════ */
function cPhases(C){
  const c=findCardio(C.cid);
  const W={n:'Uppvärmning',sub:'Lugnt tempo. Du ska kunna prata i hela meningar.',sec:300,lvl:'warm'};
  const K={n:'Nedvarvning',sub:'Sakta ner och låt pulsen gå ner.',sec:300,lvl:'warm'};
  if(c.id==='int'){
    const ph=[W];for(let i=1;i<=6;i++){ph.push({n:'Hårt',sub:'Öka tempot rejält. Du ska bara orka säga enstaka ord.',say:'Öka tempot.',sec:60,lvl:'hard',rep:i});ph.push({n:'Lätt',sub:'Sakta ner och andas ut. Hämta dig inför nästa.',say:'Sakta ner.',sec:120,lvl:'easy',rep:i})}
    ph.push(K);return ph;
  }
  return[W,{n:'Jämnt tempo',sub:'Håll ett tempo där du kan prata i hela meningar. Pulsen ska vara höjd men lugn.',sec:(c.min-10)*60,lvl:'easy'},K];
}
function cStart(cid){
  unlockAudio();const C=activeCoach();
  if(!(C&&C.kind==='cardio'&&C.cid===cid)){S.coach={kind:'cardio',cid,date:today(),i:0,p:0,acc:0,t0:0,run:false,started:Date.now()};save()}
  coShow();
}
function cElapsed(){const C=S.coach,ph=cPhases(C);let e=ph.slice(0,C.p).reduce((a,x)=>a+x.sec,0)+C.acc;if(C.run)e+=(Date.now()-C.t0)/1000;return e}
function cLeft(){const C=S.coach,p=cPhases(C)[C.p];return p.sec-(C.acc+(C.run?(Date.now()-C.t0)/1000:0))}
function cGo(){const C=S.coach;C.i=1;C.p=0;C.acc=0;C.t0=Date.now();C.run=true;C.started=Date.now();save();coRender();coSay()}
function cToggle(){const C=S.coach;if(C.run){C.acc+=(Date.now()-C.t0)/1000;C.run=false}else{C.t0=Date.now();C.run=true}save();coRender()}
function cEnd(){const C=S.coach;if(C.run){C.acc+=(Date.now()-C.t0)/1000;C.run=false}C.i=2;save();coRender();say('Bra jobbat!')}
function cSkip(){const C=S.coach,ph=cPhases(C);if(C.p<ph.length-1){C.p++;C.acc=0;C.t0=Date.now();save();ping();coRender();coSay()}else cEnd()}
function cTick(){
  const C=S.coach;if(C.i!==1||!C.run)return;
  const ph=cPhases(C);let left=cLeft(),changed=false;
  while(left<=0){
    if(C.p>=ph.length-1){C.acc=ph[C.p].sec;C.run=false;C.i=2;save();ping();coRender();say('Bra jobbat! Konditionspasset är klart.');return}
    C.p++;C.acc=-left;C.t0=Date.now();left=ph[C.p].sec-C.acc;changed=true;
  }
  if(changed){save();ping();coRender();coSay();return}
  const el=document.getElementById('c-left');if(el)el.textContent=fmt(Math.ceil(left));
  const tot=ph.reduce((a,x)=>a+x.sec,0),te=document.getElementById('c-tot');if(te)te.textContent=fmt(Math.max(0,Math.ceil(tot-cElapsed())));
  const bar=document.querySelector('#coach .co-bar i');if(bar)bar.style.width=Math.min(100,cElapsed()/tot*100)+'%';
  if(Math.ceil(left)===10&&C.warn!==C.p){C.warn=C.p;const nx=ph[C.p+1];if(nx)say(`Tio sekunder. Sedan ${nx.n.toLowerCase()}.`)}
}
function cRender(){
  const C=S.coach,c=findCardio(C.cid),el=document.getElementById('coach'),ph=cPhases(C),tot=ph.reduce((a,x)=>a+x.sec,0);
  const LV={hard:'var(--hard)',easy:'var(--leg)',warm:'var(--cardio)'};
  el.style.setProperty('--c',C.i===1?LV[ph[C.p].lvl]:C_CARDIO);
  let body;
  if(C.i===0){
    body=`<div class="co-body"><div class="co-kicker">${c.day} · kondition</div><div class="co-h">${c.name}</div>
      <p class="co-p">Cirka ${c.min} minuter. ${c.what}. ${c.why}</p>
      <div class="co-card"><h3>Så hårt ska det kännas</h3><dl class="co-dl"><dt style="color:var(--leg)">Lätt</dt><dd>Du kan prata i hela meningar.</dd>${c.id==='int'?'<dt style="color:var(--hard)">Hårt</dt><dd>Du kan bara säga enstaka ord.</dd>':''}</dl></div>
      <div class="co-card"><h3>Upplägg</h3><ol class="co-steps">${c.how.map(x=>`<li><span>${x}</span></li>`).join('')}</ol><p class="co-tempo">Jag säger till när det är dags att byta. Du behöver inte titta på klockan.</p></div>
      ${voiceSwitch()}</div>${foot(`<button class="co-btn" onclick="cGo()">Starta</button>`)}`;
  }else if(C.i===1){

function kinetic(root,fresh){

function countUp(root,fresh){
  root.querySelectorAll('[data-n]').forEach(el=>{
    const to=+el.dataset.n,fmt=el.dataset.f||'int';
    const show=v=>el.textContent=fmt==='kg'?kgTxt(v):kcalTxt(v);
    if(!fresh||reduceMotion()){show(to);return}
    const t0=performance.now(),d=750;
    const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);show(fmt==='kg'?Math.round(to*e*10)/10:to*e);if(k<1)requestAnimationFrame(step)};
    show(0);requestAnimationFrame(step);
  });
}

const FX={c:null,x:null,p:[],w:0,h:0,col:'200,240,80',run:false,tx:-1,ty:-1};
function fxInit(){
  const c=document.getElementById('fx');if(!c)return;FX.c=c;FX.x=c.getContext('2d');
  const size=()=>{const dpr=Math.min(2,window.devicePixelRatio||1);FX.w=innerWidth;FX.h=innerHeight;c.width=FX.w*dpr;c.height=FX.h*dpr;c.style.width=FX.w+'px';c.style.height=FX.h+'px';FX.x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(48,Math.max(22,FX.w*FX.h/17000)));
    while(FX.p.length<n)FX.p.push({x:Math.random()*FX.w,y:Math.random()*FX.h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.6+.6});FX.p.length=n};
  size();addEventListener('resize',size);
  addEventListener('pointermove',e=>{FX.tx=e.clientX;FX.ty=e.clientY},{passive:true});
  addEventListener('pointerleave',()=>{FX.tx=-1});
  document.addEventListener('visibilitychange',fxState);
  fxTint();fxState();
}
function fxTint(){
  if(!FX.c)return;const cs=getComputedStyle(document.body),v=(cs.getPropertyValue('--fx')||'').trim();
  const m=v.match(/#([0-9a-f]{6})/i);if(m){const h=m[1];FX.col=[0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(',')}
  if(!FX.run)fxDraw(true);
}
function fxState(){
  const on=!document.hidden&&!coIsOpen&&!reduceMotion();
  if(on&&!FX.run){FX.run=true;requestAnimationFrame(fxLoop)}else if(!on)FX.run=false;
  if(!on)fxDraw(true);
}
function fxLoop(){if(!FX.run)return;fxDraw(false);requestAnimationFrame(fxLoop)}
function fxDraw(still){
  const{x,p,w,h}=FX;if(!x)return;x.clearRect(0,0,w,h);
  const col=FX.col,L=120;
  for(const a of p){
    if(!still){a.x+=a.vx;a.y+=a.vy;if(a.x<-10)a.x=w+10;if(a.x>w+10)a.x=-10;if(a.y<-10)a.y=h+10;if(a.y>h+10)a.y=-10;
      if(FX.tx>=0){const dx=a.x-FX.tx,dy=a.y-FX.ty,d=dx*dx+dy*dy;if(d<9000){a.x+=dx*.004;a.y+=dy*.004}}}
  }
  x.lineWidth=1;
  for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
    const dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<L){x.strokeStyle=`rgba(${col},${(1-d/L)*.18})`;x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.stroke()}
  }
  for(const a of p){x.fillStyle=`rgba(${col},.55)`;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}
}

/* ═════════ ISOMETRISKA DIAGRAM ═════════ */
const ISO={a:20,b:11.5};
function prism(cx,y,h,fill,opt={}){
  const{a,b}=ISO,t=y-h;
  const top=`${cx-a},${t} ${cx},${t-b} ${cx+a},${t} ${cx},${t+b}`;
  if(h<=0.5)return `<polygon points="${top}" class="iso-flat${opt.hl?' hl':''}"/>`;
  const L=`${cx-a},${t} ${cx},${t+b} ${cx},${y+b} ${cx-a},${y}`,R=`${cx},${t+b} ${cx+a},${t} ${cx+a},${y} ${cx},${y+b}`;
  return `<g class="iso-p${opt.hl?' hl':''}" style="--pc:${fill}"><polygon points="${L}" class="f-l"/><polygon points="${R}" class="f-r"/><polygon points="${top}" class="f-t"/></g>`;
}
function ghost(cx,y,h){
  const{a,b}=ISO,t=y-h;
  return `<path class="iso-ghost" d="M${cx-a} ${y}V${t}L${cx} ${t-b}L${cx+a} ${t}V${y}M${cx-a} ${t}L${cx} ${t+b}L${cx+a} ${t}M${cx} ${t+b}V${y+b}"/>`;
}
/* Makron: tre staplar, ätit (fylld) mot mål (streckad ram). Direktetiketter – identitet aldrig bara färg. */
function isoMacros(E,T){
  const H=96,W=330,base=H+42,cols=[['Protein','p','var(--series-1)'],['Kolhydrater','c','var(--series-2)'],['Fett','f','var(--series-3)']];
  let s='';
  cols.forEach(([lbl,k,c],i)=>{
    const cx=62+i*103,v=Math.round(E[k]||0),t=Math.max(1,T[k]),h=Math.min(1.15,v/t)*H;
    s+=`<g><title>${lbl}: ${v} av ${t} g</title>${ghost(cx,base,H)}${prism(cx,base,h,c)}
      <text x="${cx}" y="${base+ISO.b+20}" class="iso-lbl" text-anchor="middle">${lbl}</text>
      <text x="${cx}" y="${base+ISO.b+38}" class="iso-val" text-anchor="middle">${v} / ${t} g</text></g>`;
  });
  return `<svg class="iso" viewBox="0 0 ${W} ${base+ISO.b+46}" role="img" aria-label="Makronutrienter idag: ${cols.map(([l,k])=>`${l} ${Math.round(E[k]||0)} av ${T[k]} gram`).join(', ')}">${s}</svg>`;
}

  const L=edList();
  if(op==='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];

let zxReader=null;
function loadZX(){return new Promise((res,rej)=>{if(window.ZXing)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function startScan(cb){
  scanCb=cb;const el=document.getElementById('scan'),msg=document.getElementById('scan-msg');
  document.getElementById('scan-code').value='';el.classList.add('show');msg.textContent='Startar kameran…';
  const v=document.getElementById('scan-v');
  if('BarcodeDetector' in window){
    try{
      detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      v.srcObject=scanStream;await v.play();msg.textContent='Håll streckkoden inom rutan';scanOn=true;scanLoop();return;
    }catch(e){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
  }
  try{
    await loadZX();
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    zxReader=new ZXing.BrowserMultiFormatReader(hints);scanOn=true;msg.textContent='Håll streckkoden inom rutan';
    await zxReader.decodeFromConstraints({video:{facingMode:'environment'}},v,(r)=>{if(r&&scanOn){scanOn=false;navigator.vibrate&&navigator.vibrate(60);gotCode(r.getText())}});
  }catch(e){msg.textContent='Kameran gick inte att starta här. Skriv siffrorna under streckkoden.'}
}
function stopScan(){scanOn=false;if(zxReader){try{zxReader.reset()}catch(e){}zxReader=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}document.getElementById('scan').classList.remove('show')}

let CH=null;
function weightSeries(days){
  const out=[];for(let i=days-1;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const k=ds(dt),w=S.body[k]&&+S.body[k].w||null;
    const win=[];for(let j=0;j<7;j++){const x=new Date(dt);x.setDate(x.getDate()-j);const b=S.body[ds(x)];if(b&&b.w)win.push(+b.w)}
    out.push({k,dt,w,avg:win.length?win.reduce((a,b)=>a+b,0)/win.length:null})}
  return out;
}

  const waists=Object.keys(S.body).sort().filter(k=>S.body[k].waist);
  let trend='Väg dig några morgnar i rad, så räknar appen ut ditt snitt.',advice='';
  if(b.a0&&b.a1){
