    trend=`Snittet har ändrats <b>${dw>0?'+':''}${dw.toFixed(1).replace('.',',')} kg</b> sedan förra veckan.`;

    else if(dw<=-0.1||(dWaist!==null&&dWaist<0))advice='';
    else if(dw>=0)advice=`Ingen nedgång. Logga maten noga i en vecka. Står det still: sänk till cirka ${S.budget-150} kcal.`;
  }
  const pw=programWeek(),recs=records(),hist=historyList();
  const ser=weightSeries(30),hasData=ser.filter(x=>x.w).length>=2;
  const dt=k=>parseD(k).toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
  return `<h1 class="kt">Kropp</h1>
    <section class="card wcard">
      <div class="kick">${t.w?'Din vikt idag':lastW?'Senaste vikt · '+dt(lastW):'Ingen vikt än'}</div>
      <div class="big">${lastW?`<b data-n="${S.body[lastW].w}" data-f="kg">${kgTxt(S.body[lastW].w)}</b>`:'<b>–</b>'}<span>kg</span></div>
      <p class="muted">${trend}</p>${advice?`<div class="note">${advice}</div>`:''}
      ${hasData?`<div class="chart" id="chart" onpointermove="chartHover(event)" onpointerdown="chartHover(event)" onpointerleave="chartHide()"></div>
        <div class="legend"><span><i class="lg-dot"></i>Vägning</span><span><i class="lg-line"></i>Snitt 7 dagar</span></div>`:''}
      <button class="btn ${t.w?'sec':'pri'} full" style="margin-top:1rem" onclick="openWeigh()">${t.w?'Ändra dagens vikt':'Väg dig nu'}</button>
    </section>
    <h2>Dina bästa lyft</h2>
    <div class="card recs">${recs.length?recs.slice(0,6).map(r=>`<div class="rec"><span>${escH(r.sv)}<small>${r.date}</small></span><b>${kgTxt(r.kg)} kg × ${r.reps}</b></div>`).join('')+(recs.length>6?`<details class="more"><summary>Visa alla ${recs.length}</summary>${recs.slice(6).map(r=>`<div class="rec"><span>${escH(r.sv)}<small>${r.date}</small></span><b>${kgTxt(r.kg)} kg × ${r.reps}</b></div>`).join('')}</details>`:''):'<p class="small">Kör ett pass, så syns dina bästa vikter här.</p>'}</div>
    <h2>Mer</h2>
    <div class="list school">
      <details><summary>Midja${lastM?' · '+kgTxt(S.body[lastM].waist)+' cm':''}</summary><div>
        <p style="color:var(--ink2)">${waists.length>=2?`Sedan första mätningen: <b>${(()=>{const dv=S.body[waists[waists.length-1]].waist-S.body[waists[0]].waist;return (dv>0?'+':'')+dv.toFixed(1).replace('.',',')})()} cm</b>.`:'Mät vid naveln en gång i veckan, samma dag.'}</p>
        <button class="btn sec full" style="margin-top:.8rem" onclick="openWaist()">Mät midjan</button></div></details>
      <details><summary>Senaste passen</summary><div>${hist||'<p class="small">Inga pass än.</p>'}</div></details>
      <details><summary>Om programmet</summary><div><p style="color:var(--ink2)">${PROG.name}, vecka <b>${pw.w} av ${BLOCK}</b>. Vecka 1–2 hittar du vikterna, vecka 3–7 ökar du, vecka 8 är en lätt vecka. Sedan börjar det om.</p></div></details>
    </div>`;
}
function records(){
  const out=[];
  Object.keys(S.log).forEach(n=>{
    let best=null;Object.entries(S.log[n]||{}).forEach(([k,a])=>(a||[]).forEach(x=>{if(x.reps&&x.kg!==''&&(!best||+x.kg>best.kg||(+x.kg===best.kg&&+x.reps>best.reps)))best={kg:+x.kg,reps:+x.reps,k}}));
    if(best&&best.kg>0)out.push({n,sv:(EXI[n]||{}).sv||n,kg:best.kg,reps:best.reps,k:best.k,date:parseD(best.k).toLocaleDateString('sv-SE',{day:'numeric',month:'short'})})});
  return out.sort((a,b)=>b.k.localeCompare(a.k));
}
function historyList(){
  const items=[...Object.entries(S.done).map(([d,id])=>({d,id,k:'s'})),...Object.entries(S.cardio).map(([d,c])=>({d,c,k:'c'}))].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,10);
  return items.map(it=>{
    const dt=parseD(it.d).toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'short'});
    if(it.k==='c')return `<div class="rec"><span><b>Kondition</b><small>${dt}</small></span><b>${it.c.min} min</b></div>`;
    const s=findSession(it.id),L=dayLog(it.d),sets=L.reduce((a,x)=>a+x.t.filter(y=>y.ok).length,0);
    const lines=L.map(x=>`${escH(x.sv)}: ${x.t.map(y=>y.reps).join('/')} × ${kgTxt(+x.t[0].kg||0)} kg`);
    return `<details class="more rec" style="display:block"><summary><span><b>${s?escH(s.title):'Pass'}</b><small>${dt} · ${sets} set</small></span></summary>${lines.length?`<div class="hist-l">${lines.join('<br>')}</div>`:''}</details>`;
  }).join('');
}
/* Viktgraf: prickar = vägningar, linje = 7-dagarssnitt. Hovring/tryck visar värden. */
function drawChart(){
  const el=document.getElementById('chart');if(!el)return;
  const ser=weightSeries(30),W=Math.max(260,el.clientWidth),H=Math.round(W*.52),fs=parseFloat(getComputedStyle(document.documentElement).fontSize);
  const pl=fs*2.6,pr=fs*.6,pt=fs*.6,pb=fs*1.7;
  const vals=ser.flatMap(x=>[x.w,x.avg]).filter(Boolean);let lo=Math.min(...vals),hi=Math.max(...vals);
  const step=hi-lo>4?1:.5;lo=Math.floor((lo-.2)/step)*step;hi=Math.ceil((hi+.2)/step)*step;if(hi-lo<step*2)hi=lo+step*2;
  const X=i=>pl+i*(W-pl-pr)/(ser.length-1),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g='';for(let v=lo;v<=hi+1e-6;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${String(+v.toFixed(1)).replace('.',',')}</text>`}
  const lbl=[0,15,29].map(i=>`<text class="ax" x="${X(i)}" y="${H-fs*.4}" text-anchor="${i===0?'start':i===29?'end':'middle'}">${ser[i].dt.toLocaleDateString('sv-SE',{day:'numeric',month:'short'})}</text>`).join('');
  let path='',pen=false;ser.forEach((x,i)=>{if(x.avg){path+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(x.avg).toFixed(1)+' ';pen=true}else pen=false});
  const dots=ser.map((x,i)=>x.w?`<circle cx="${X(i)}" cy="${Y(x.w)}" r="4.5" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"/>`:'').join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Viktkurva för de senaste 30 dagarna">${g}${lbl}<path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}<line id="ch-x" y1="${pt}" y2="${H-pb}" stroke="var(--line2)" stroke-width="1" style="display:none"/><circle id="ch-o" r="6" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg><div class="tip" id="ch-tip"></div>`;
  CH={ser,X,Y,W,H,pl,pr};
}
function chartHover(ev){
  if(!CH)return;const el=document.getElementById('chart'),r=el.getBoundingClientRect(),x=(ev.clientX-r.left)*(CH.W/r.width);
  let best=null,bd=1e9;CH.ser.forEach((p,i)=>{if(!p.w&&!p.avg)return;const d=Math.abs(CH.X(i)-x);if(d<bd){bd=d;best=i}});
  if(best==null)return;const p=CH.ser[best],cx=CH.X(best),ln=document.getElementById('ch-x'),o=document.getElementById('ch-o'),tip=document.getElementById('ch-tip');
  ln.setAttribute('x1',cx);ln.setAttribute('x2',cx);ln.style.display='';
  if(p.w){o.setAttribute('cx',cx);o.setAttribute('cy',CH.Y(p.w));o.style.display=''}else o.style.display='none';
  tip.innerHTML=`<b>${p.dt.toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'})}</b>${p.w?`<span><i class="lg-dot"></i>Vägning ${kgTxt(p.w)} kg</span>`:''}${p.avg?`<span><i class="lg-line"></i>Snitt ${p.avg.toFixed(1).replace('.',',')} kg</span>`:''}`;
  tip.style.display='block';const px=cx*r.width/CH.W,tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(r.width-tw,px-tw/2))+'px';tip.style.top='-0.4rem';tip.style.transform='translateY(-100%)';
}
function chartHide(){['ch-x','ch-o','ch-tip'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none'})}

function setLook(k,v){S[k]=v;save();render()}

let gStep=null;
function openGuide(){gStep=0;showGuide()}
function showGuide(){
  const g=GUIDE[gStep];if(g.tab==='settings'){if(tab!=='settings')prevTab=tab;tab='settings'}else tab=g.tab;render();window.scrollTo(0,0);

}
function closeGuide(){gStep=null;S.guideSeen=true;S.uiV=UI_V;save();document.getElementById('guide').classList.remove('show');tab='today';render();window.scrollTo(0,0)}

let OB=null;
const obSteps=()=>OB&&OB.first?['hello','sex','age','h','w','goal','act','time','prog','done']:['hello','sex','age','h','w','goal','act','time','done'];
function openOnb(first){
  const P=S.profile&&!S.profile.auto?S.profile:{};
  OB={first:!!first,i:0,d:{name:P.name||'',sex:P.sex||'',age:P.age||35,h:P.h||(P.sex==='f'?165:178),w:latestW()||P.w||75,goal:P.goal||'',act:P.act||'',time:S.trainTime||'18:00',prog:''}};
  document.getElementById('onb').classList.add('show');obRender();
}
function obSet(k,v,adv){OB.d[k]=v;if(k==='sex'&&!S.profile)OB.d.h=v==='f'?165:178;if(adv)obNext();else obRender()}
function obNum(k,v,min,max){v=Math.round(+v*10)/10;if(isNaN(v))return;OB.d[k]=Math.max(min,Math.min(max,v));obRender()}
function obNext(){
  const st=obSteps()[OB.i],d=OB.d;
  if(st==='hello'){d.name=(document.getElementById('ob-name').value||'').trim().slice(0,30)}
  if(st==='sex'&&!d.sex){toast('Välj ett alternativ');return}
  if(st==='goal'&&!d.goal){toast('Välj ett mål');return}
  if(st==='act'&&!d.act){toast('Välj ett alternativ');return}
  if(st==='time'){const v=document.getElementById('ob-time').value;if(/^\d\d:\d\d$/.test(v))d.time=v}
  if(st==='prog'&&!d.prog){toast('Välj ett alternativ');return}
  OB.i=Math.min(OB.i+1,obSteps().length-1);obRender();
}
function obBack(){if(OB.i>0){OB.i--;obRender()}else if(!OB.first)obClose()}
function obClose(){OB=null;document.getElementById('onb').classList.remove('show')}
function obFinish(){
  const d=OB.d,first=OB.first,T=calcTargets(d);
  S.profile={name:d.name,sex:d.sex,age:+d.age,h:+d.h,w:+d.w,goal:d.goal,act:d.act};
  S.budget=T.kcal;S.protein=T.protein;S.trainTime=d.time;TRAIN_TIME=d.time;
  if(first){S.body[today()]=Object.assign(S.body[today()]||{},{w:+d.w});S.start=mondayOf(new Date())}
  if(first){S.prog={id:d.prog||'ul4',mod:{}};applyProgram()}
  save();obClose();tab='today';animTab=null;render();window.scrollTo(0,0);
  if(first&&S.uiV!==UI_V)setTimeout(()=>{gStep=0;showGuide()},350);else toast('Dina mål är uppdaterade');
}

function obChoice(k,opts){

  if(st==='time'){q='När brukar du träna?';body=`<p class="lead">Måltiderna före och efter passet läggs runt den här tiden. Du kan ändra den när som helst.</p>
      <div class="seg ob-seg">${['07:00','12:00','17:00','19:00'].map(t=>`<button aria-pressed="${d.time===t}" onclick="OB.d.time='${t}';obRender()">${t}</button>`).join('')}</div>
      <label class="ob-lbl" for="ob-time">Annan tid</label><input class="inp ob-inp" id="ob-time" type="time" value="${d.time}" onchange="OB.d.time=this.value">`}
  if(st==='prog'){q='Hur många dagar vill du träna?';next=false;body=`<p class="lead">Du kan byta program när som helst under Träna.</p>`+obChoice('prog',[['fb3','3 dagar – Helkropp','Bra om du är ny, kommer tillbaka eller har lite tid'],['ul4','4 dagar – Överkropp / Ben','Styrka och muskler, varje muskel två gånger i veckan'],['ppl6','6 dagar – Push / Pull / Ben','För dig som har tränat ett tag']])}
  if(st==='done'){const T=calcTargets(d),pp=PROGRAMS.find(p=>p.id===(d.prog||PROG.id))||PROG;q=(d.name?d.name+', h':'H')+'är är din plan';
    body=`<div class="ob-res"><div><b>${T.kcal}</b><span>kcal per dag</span></div><div><b>${T.protein} g</b><span>protein per dag</span></div></div>
      <p class="lead">Utifrån ${d.age} år, ${d.h} cm och ${kgTxt(d.w)} kg. Målet: ${({lose:'gå ner i vikt',recomp:'bli starkare och fastare',gain:'bygga mer muskler'})[d.goal]}.</p>
      <div class="card ob-card"><p><b>Träning:</b> ${pp.name}, ${pp.days} styrkepass i veckan i maskiner och kabel. Träningstid ${d.time}.</p><p style="margin-top:.4rem">Väg dig några morgnar i veckan. Appen säger till om kalorierna behöver justeras. Du kan ändra allt under Inställningar.</p></div>`}
  const last=st==='done';
  document.getElementById('onb').innerHTML=`<div class="ob-in" role="dialog" aria-modal="true" aria-label="Kom igång">
    <div class="ob-top">${OB.i>0||!OB.first?`<button class="lnk ob-back" onclick="obBack()">‹ ${OB.i>0?'Tillbaka':'Stäng'}</button>`:'<span></span>'}<span class="ob-n">${Math.min(OB.i+1,n)} av ${n}</span></div>
    <div class="ob-bar"><i style="width:${Math.round(OB.i/n*100)}%"></i></div>
    <div class="ob-body"><h1 class="ob-q">${q}</h1>${body}</div>
    <div class="ob-foot">${last?`<button class="btn pri big" onclick="obFinish()">${OB.first?'Börja':'Spara'}</button>`:next?`<button class="btn pri big" onclick="obNext()">Nästa</button>`:''}</div></div>`;
  const el=document.querySelector('.ob-body');if(el)el.scrollTop=0;
}

/* ═════════ PWA & START ═════════ */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='settings')render()});
async function installApp(){if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;render()}
const standalone=()=>matchMedia('(display-mode: standalone)').matches;

if((S.uiV||0)<UI_V&&S.uiV){S.theme='dark'}
save();render();fxInit();
if(!S.profile){openOnb(true)}
else if(S.uiV!==UI_V){setTimeout(()=>{gStep=0;showGuide()},400)}
else{const C=activeCoach();if(C&&Date.now()-C.started<3*36e5)setTimeout(coOpen,300)}
let lastMin=hhmm(),lastDay=today();
const typing=()=>['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
const dlgOpen=()=>document.getElementById('dlg-bg').classList.contains('show')||document.getElementById('sheet-bg').classList.contains('show');
setInterval(()=>{
  const c=document.getElementById('clock'),t=hhmm();if(c)c.textContent=t;
  if(today()!==lastDay){lastDay=today();coachAns='';if(!coIsOpen&&!dlgOpen())render();return}
  if(t!==lastMin){lastMin=t;if((tab==='today'||tab==='food')&&!coIsOpen&&!typing()&&!dlgOpen()&&gStep===null)render()}
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!typing()&&!coIsOpen&&!dlgOpen()){lastDay=today();render()}});
window.addEventListener('resize',()=>{if(tab==='prog')drawChart()});


/* Partiklarna pausar när tränarläget är öppet */
const _coShow=coShow,_coHide=coHide;
coShow=function(){_coShow();fxState()};coHide=function(){_coHide();fxState()};

</script>
